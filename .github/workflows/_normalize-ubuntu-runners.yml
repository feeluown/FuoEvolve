name: Normalize Ubuntu runners

"on":
  push:
    branches:
      - fix/linux-rust-cache-baseline
    paths:
      - .github/workflows/_normalize-ubuntu-runners.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/linux-rust-cache-baseline
          fetch-depth: 0

      - name: Normalize Linux runner versions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.github/workflows')
          helper = root / '_normalize-ubuntu-runners.yml'
          for pattern in ('*.yml', '*.yaml'):
              for path in root.glob(pattern):
                  if path == helper:
                      continue
                  text = path.read_text()
                  updated = text.replace('runs-on: ubuntu-latest', 'runs-on: ubuntu-24.04')
                  updated = updated.replace('runs-on: ubuntu-22.04', 'runs-on: ubuntu-24.04')
                  updated = updated.replace(
                      'nucleus-web-login-linux-ubuntu22.04-',
                      'nucleus-web-login-linux-ubuntu24.04-',
                  )
                  if updated != text:
                      path.write_text(updated)
          helper.unlink()
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows
          git commit -m "ci: standardize Linux runners on Ubuntu 24.04"
          git push origin HEAD:fix/linux-rust-cache-baseline
