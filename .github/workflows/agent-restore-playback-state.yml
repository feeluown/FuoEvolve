              '''    @Test
              fun restoredQueueToggleStartsCurrentTrackFromBeginning() = runTest {
          ''',
              '''    @Test
              fun delayedQueueRestorePreservesCompletePausedPlaybackState() = runTest {
                  val first = providerTrack("provider:1", "First")
                  val second = providerTrack("provider:2", "Second")
                  val inserted = providerTrack("provider:3", "Inserted")
                  val pending = providerTrack("provider:4", "Pending")
                  val partOne = PlaybackPart("provider:3:1", "Part 1", 60_000)
                  val partTwo = PlaybackPart("provider:3:2", "Part 2", 90_000)
                  val queueStore = DelayedPlaybackQueueStore(
                      PlaybackQueueSnapshot(
                          mainQueue = listOf(first, second),
                          originalMainQueue = listOf(first, second),
                          upNextQueue = listOf(pending),
                          queueIndex = 0,
                          shuffleEnabled = true,
                          repeatMode = RepeatMode.SINGLE,
                          currentUpNextTrack = inserted,
                          currentIsUpNext = true,
