name: Apply playback restore fix

"on":
  push:
    branches:
      - agent/restore-playback-state
    paths:
      - ".github/workflows/agent-restore-playback-state.yml"

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Apply playback state restoration fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          def replace_once(path, old, new):
              path = Path(path)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match in {path}, found {count}: {old[:80]!r}")
              path.write_text(text.replace(old, new, 1))

          contracts = "shared/src/commonMain/kotlin/org/feeluown/mobile/FuoContracts.kt"
          controller = "shared/src/commonMain/kotlin/org/feeluown/mobile/FuoPlayerController.kt"
          android_queue = "androidApp/src/main/kotlin/org/feeluown/mobile/AndroidPlaybackQueueStore.kt"
          android_engine = "androidApp/src/main/kotlin/org/feeluown/mobile/AndroidNativeAudioEngine.kt"
          ios_queue = "shared/src/iosMain/kotlin/org/feeluown/mobile/IosPlaybackQueueStore.kt"
          tests = "shared/src/commonTest/kotlin/org/feeluown/mobile/FuoPlayerControllerTest.kt"

          replace_once(
              contracts,
              '''data class PlaybackQueueSnapshot(
              val mainQueue: List<MusicTrack> = emptyList(),
              val originalMainQueue: List<MusicTrack> = emptyList(),
              val upNextQueue: List<MusicTrack> = emptyList(),
              val queueIndex: Int = -1,
              val shuffleEnabled: Boolean = false,
              val repeatMode: RepeatMode = RepeatMode.QUEUE,
              val isFmQueue: Boolean = false,
              val shuffleBeforeFm: Boolean? = null,
          )

          interface PlaybackQueueStore {
              suspend fun load(): PlaybackQueueSnapshot
              suspend fun save(snapshot: PlaybackQueueSnapshot)
          }
          ''',
              '''data class PlaybackQueueSnapshot(
              val mainQueue: List<MusicTrack> = emptyList(),
              val originalMainQueue: List<MusicTrack> = emptyList(),
              val upNextQueue: List<MusicTrack> = emptyList(),
              val queueIndex: Int = -1,
              val shuffleEnabled: Boolean = false,
              val repeatMode: RepeatMode = RepeatMode.QUEUE,
              val isFmQueue: Boolean = false,
              val shuffleBeforeFm: Boolean? = null,
              val currentUpNextTrack: MusicTrack? = null,
              val currentIsUpNext: Boolean = false,
              val queueFeature: ProviderFeature? = null,
              val queuePlaylistId: String? = null,
          )

          interface PlaybackQueueStore {
              suspend fun load(): PlaybackQueueSnapshot
              fun stage(snapshot: PlaybackQueueSnapshot) = Unit
              suspend fun save(snapshot: PlaybackQueueSnapshot)
              fun flush() = Unit
          }
          ''',
          )

          replace_once(
              contracts,
              '''object PlaybackQueueCodec {
              private const val CURRENT_VERSION = "v2"

              fun encode(snapshot: PlaybackQueueSnapshot): String {
                  return buildList {
                      add(CURRENT_VERSION)
                      add(
                          listOf(
                              snapshot.queueIndex.toString(),
                              snapshot.shuffleEnabled.toString(),
                              snapshot.repeatMode.name,
                              snapshot.isFmQueue.toString(),
                              snapshot.shuffleBeforeFm?.toString().orEmpty(),
                          ).joinToString("\\t")
                      )
                      addTracks("main", snapshot.mainQueue)
                      addTracks("original", snapshot.originalMainQueue)
                      addTracks("upNext", snapshot.upNextQueue)
                  }.joinToString("\\n")
              }

              fun decode(raw: String): PlaybackQueueSnapshot {
                  val lines = raw.lineSequence().filter { it.isNotBlank() }.toList()
                  if (lines.isEmpty()) return PlaybackQueueSnapshot()

                  val version = lines.first()
                  val flags = lines.getOrNull(1)?.split("\\t") ?: return PlaybackQueueSnapshot()

                  // 根据版本解析 repeatMode
                  val repeatMode = when (version) {
                      "v1" -> {
                          val boolValue = flags.getOrNull(2)?.toBooleanStrictOrNull() ?: true
                          if (boolValue) RepeatMode.QUEUE else RepeatMode.OFF
                      }
                      CURRENT_VERSION -> {
                          runCatching { RepeatMode.valueOf(flags.getOrNull(2) ?: "QUEUE") }
                              .getOrDefault(RepeatMode.QUEUE)
                      }
                      else -> RepeatMode.QUEUE
                  }

                  val tracksBySection = lines.drop(2)
                      .mapNotNull { line ->
                          val fields = line.split("\\t")
                          if (fields.size < 2 || fields[0] != "track") return@mapNotNull null
                          decodeTrack(fields.drop(2))?.let { track -> fields[1] to track }
                      }
                      .groupBy({ it.first }, { it.second })
                  return PlaybackQueueSnapshot(
                      mainQueue = tracksBySection["main"].orEmpty(),
                      originalMainQueue = tracksBySection["original"].orEmpty(),
                      upNextQueue = tracksBySection["upNext"].orEmpty(),
                      queueIndex = flags.getOrNull(0)?.toIntOrNull() ?: -1,
                      shuffleEnabled = flags.getOrNull(1)?.toBooleanStrictOrNull() ?: false,
                      repeatMode = repeatMode,
                      isFmQueue = flags.getOrNull(3)?.toBooleanStrictOrNull() ?: false,
                      shuffleBeforeFm = flags.getOrNull(4)?.takeIf { it.isNotBlank() }?.toBooleanStrictOrNull(),
                  )
              }
          ''',
              '''object PlaybackQueueCodec {
              private const val CURRENT_VERSION = "v3"

              fun encode(snapshot: PlaybackQueueSnapshot): String {
                  val feature = snapshot.queueFeature
                  return buildList {
                      add(CURRENT_VERSION)
                      add(
                          listOf(
                              snapshot.queueIndex.toString(),
                              snapshot.shuffleEnabled.toString(),
                              snapshot.repeatMode.name,
                              snapshot.isFmQueue.toString(),
                              snapshot.shuffleBeforeFm?.toString().orEmpty(),
                              snapshot.currentIsUpNext.toString(),
                              snapshot.queuePlaylistId.orEmpty(),
                              feature?.id.orEmpty(),
                              feature?.providerId.orEmpty(),
                              feature?.providerName.orEmpty(),
                              feature?.title.orEmpty(),
                              feature?.category?.name.orEmpty(),
                              feature?.contentType?.name.orEmpty(),
                              feature?.requiresLogin?.toString().orEmpty(),
                          ).map(::escape).joinToString("\\t")
                      )
                      addTracks("main", snapshot.mainQueue)
                      addTracks("original", snapshot.originalMainQueue)
                      addTracks("upNext", snapshot.upNextQueue)
                      addTracks("currentUpNext", listOfNotNull(snapshot.currentUpNextTrack))
                  }.joinToString("\\n")
              }

              fun decode(raw: String): PlaybackQueueSnapshot {
                  val lines = raw.lineSequence().filter { it.isNotBlank() }.toList()
                  if (lines.isEmpty()) return PlaybackQueueSnapshot()

                  val version = lines.first()
                  val flags = lines.getOrNull(1)?.split("\\t")?.map(::unescape)
                      ?: return PlaybackQueueSnapshot()

                  // v1 stored repeat as a boolean; v2 and newer store the enum name.
                  val repeatMode = when (version) {
                      "v1" -> {
                          val boolValue = flags.getOrNull(2)?.toBooleanStrictOrNull() ?: true
                          if (boolValue) RepeatMode.QUEUE else RepeatMode.OFF
                      }
                      "v2", CURRENT_VERSION -> {
                          runCatching { RepeatMode.valueOf(flags.getOrNull(2) ?: "QUEUE") }
                              .getOrDefault(RepeatMode.QUEUE)
                      }
                      else -> RepeatMode.QUEUE
                  }

                  val queueFeature = if (version == CURRENT_VERSION) {
                      runCatching {
                          val id = flags.getOrNull(7)?.takeIf { it.isNotBlank() } ?: return@runCatching null
                          ProviderFeature(
                              id = id,
                              providerId = flags.getOrNull(8).orEmpty(),
                              providerName = flags.getOrNull(9).orEmpty(),
                              title = flags.getOrNull(10).orEmpty(),
                              category = ProviderFeatureCategory.valueOf(flags.getOrNull(11).orEmpty()),
                              contentType = ProviderContentType.valueOf(flags.getOrNull(12).orEmpty()),
                              requiresLogin = flags.getOrNull(13)?.toBooleanStrictOrNull() ?: false,
                          )
                      }.getOrNull()
                  } else {
                      null
                  }

                  val tracksBySection = lines.drop(2)
                      .mapNotNull { line ->
                          val fields = line.split("\\t")
                          if (fields.size < 2 || fields[0] != "track") return@mapNotNull null
                          decodeTrack(fields.drop(2))?.let { track -> fields[1] to track }
                      }
                      .groupBy({ it.first }, { it.second })
                  return PlaybackQueueSnapshot(
                      mainQueue = tracksBySection["main"].orEmpty(),
                      originalMainQueue = tracksBySection["original"].orEmpty(),
                      upNextQueue = tracksBySection["upNext"].orEmpty(),
                      queueIndex = flags.getOrNull(0)?.toIntOrNull() ?: -1,
                      shuffleEnabled = flags.getOrNull(1)?.toBooleanStrictOrNull() ?: false,
                      repeatMode = repeatMode,
                      isFmQueue = flags.getOrNull(3)?.toBooleanStrictOrNull() ?: false,
                      shuffleBeforeFm = flags.getOrNull(4)?.takeIf { it.isNotBlank() }?.toBooleanStrictOrNull(),
                      currentUpNextTrack = tracksBySection["currentUpNext"]?.firstOrNull(),
                      currentIsUpNext = if (version == CURRENT_VERSION) {
                          flags.getOrNull(5)?.toBooleanStrictOrNull() ?: false
                      } else {
                          false
                      },
                      queueFeature = queueFeature,
                      queuePlaylistId = if (version == CURRENT_VERSION) flags.getOrNull(6)?.ifBlank { null } else null,
                  )
              }
          ''',
          )

          replace_once(
              contracts,
              '''    fun stop()
              fun seekTo(positionMs: Long)
          }
          ''',
              '''    fun stop()
              fun seekTo(positionMs: Long)
              fun flushState() = Unit
          }
          ''',
