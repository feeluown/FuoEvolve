          replace_once(
              tests,
              '''    private class FakePlaybackQueueStore(initial: PlaybackQueueSnapshot = PlaybackQueueSnapshot()) : PlaybackQueueStore {
              var saved = initial
                  private set

              override suspend fun load(): PlaybackQueueSnapshot = saved

              override suspend fun save(snapshot: PlaybackQueueSnapshot) {
                  saved = snapshot
              }
          }
          ''',
              '''    private class FakePlaybackQueueStore(initial: PlaybackQueueSnapshot = PlaybackQueueSnapshot()) : PlaybackQueueStore {
              var saved = initial
                  private set
              var staged = initial
                  private set
              var flushCount = 0
                  private set

              override suspend fun load(): PlaybackQueueSnapshot = saved

              override fun stage(snapshot: PlaybackQueueSnapshot) {
                  staged = snapshot
              }

              override suspend fun save(snapshot: PlaybackQueueSnapshot) {
                  saved = snapshot
              }

              override fun flush() {
                  flushCount += 1
              }
          }

          private class DelayedPlaybackQueueStore(initial: PlaybackQueueSnapshot) : PlaybackQueueStore {
              val allowLoad = CompletableDeferred<Unit>()
              private var snapshot = initial
              var saveCount = 0
                  private set

              override suspend fun load(): PlaybackQueueSnapshot {
                  allowLoad.await()
                  return snapshot
              }

              override suspend fun save(snapshot: PlaybackQueueSnapshot) {
                  saveCount += 1
                  this.snapshot = snapshot
              }
          }
          ''',
          )

          codec_test = Path("shared/src/commonTest/kotlin/org/feeluown/mobile/PlaybackQueueCodecTest.kt")
          codec_test.write_text('''package org.feeluown.mobile

          import kotlin.test.Test
          import kotlin.test.assertEquals
          import kotlin.test.assertFalse
          import kotlin.test.assertNull
          import kotlin.test.assertTrue

          class PlaybackQueueCodecTest {
              @Test
              fun v3RoundTripPreservesCompleteQueueState() {
                  val feature = ProviderFeature(
                      id = "daily\\tqueue",
                      providerId = "netease",
                      providerName = "网易云音乐",
                      title = "每日\\n推荐",
