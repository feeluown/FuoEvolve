          replace_once(
              controller,
              '''    private var currentUpNextTrack: MusicTrack? = null
              private var currentIsUpNext: Boolean = false
              private var queueFeature: ProviderFeature? = null
          ''',
              '''    private var currentUpNextTrack: MusicTrack? = null
