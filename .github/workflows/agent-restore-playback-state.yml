                      requiresLogin = true,
                  )
                  val snapshot = PlaybackQueueSnapshot(
                      mainQueue = listOf(track("main:1"), track("main:2")),
                      originalMainQueue = listOf(track("main:2"), track("main:1")),
                      upNextQueue = listOf(track("next:2")),
                      queueIndex = 0,
                      shuffleEnabled = true,
                      repeatMode = RepeatMode.SINGLE,
                      isFmQueue = false,
                      shuffleBeforeFm = true,
                      currentUpNextTrack = track("next:1"),
                      currentIsUpNext = true,
                      queueFeature = feature,
                      queuePlaylistId = "playlist\\t42",
                  )

                  val decoded = PlaybackQueueCodec.decode(PlaybackQueueCodec.encode(snapshot))

                  assertEquals(snapshot, decoded)
              }

              @Test
              fun v2DecodeKeepsShuffleAndRepeatMode() {
                  val decoded = PlaybackQueueCodec.decode("v2\\n0\\ttrue\\tSINGLE\\tfalse\\t")

                  assertTrue(decoded.shuffleEnabled)
                  assertEquals(RepeatMode.SINGLE, decoded.repeatMode)
                  assertFalse(decoded.currentIsUpNext)
                  assertNull(decoded.currentUpNextTrack)
                  assertNull(decoded.queueFeature)
                  assertNull(decoded.queuePlaylistId)
              }

              private fun track(id: String) = MusicTrack(
