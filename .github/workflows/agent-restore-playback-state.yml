          replace_once(
              controller,
              '''    private fun restorePlaybackQueue(snapshot: PlaybackQueueSnapshot) {
              mainQueue = snapshot.mainQueue
              originalMainQueue = snapshot.originalMainQueue
              upNextQueue = snapshot.upNextQueue
              mainQueueIndex = snapshot.queueIndex.coerceIn(-1, mainQueue.lastIndex)
              shuffleEnabled = snapshot.shuffleEnabled
              _repeatMode = snapshot.repeatMode
              isFmQueue = snapshot.isFmQueue
              shuffleBeforeFm = snapshot.shuffleBeforeFm
              currentUpNextTrack = null
              currentIsUpNext = false
              playbackParts = emptyList()
              currentPartIndex = -1
              playbackState = playbackState.copy(
                  currentTrack = mainQueue.getOrNull(mainQueueIndex),
                  queue = displayQueue(),
                  queueIndex = displayQueueIndex(),
                  playbackParts = playbackParts,
                  currentPartIndex = currentPartIndex,
              )
          }
          ''',
              '''    private fun restorePlaybackQueue(snapshot: PlaybackQueueSnapshot) {
              mainQueue = snapshot.mainQueue
              originalMainQueue = snapshot.originalMainQueue
              upNextQueue = snapshot.upNextQueue
              mainQueueIndex = snapshot.queueIndex.coerceIn(-1, mainQueue.lastIndex)
              shuffleEnabled = snapshot.shuffleEnabled
              _repeatMode = snapshot.repeatMode
              isFmQueue = snapshot.isFmQueue
              shuffleBeforeFm = snapshot.shuffleBeforeFm
              queueFeature = snapshot.queueFeature
              queuePlaylistId = snapshot.queuePlaylistId
              currentUpNextTrack = snapshot.currentUpNextTrack
              currentIsUpNext = snapshot.currentIsUpNext && currentUpNextTrack != null

              // The platform engine may restore its resumable session before settings and the queue
              // finish loading. Keep that authoritative current item, position and part state instead
              // of replacing them with a partially restored controller queue.
              val restoredEngineState = playbackState
              val restoredEngineTrack = restoredEngineState.currentTrack
              if (restoredEngineTrack != null) {
                  if (currentQueueTrack()?.id != restoredEngineTrack.id) {
                      val mainIndex = mainQueue.indexOfFirst { it.id == restoredEngineTrack.id }
                      val upNextIndex = upNextQueue.indexOfFirst { it.id == restoredEngineTrack.id }
                      when {
                          mainIndex >= 0 -> {
                              mainQueueIndex = mainIndex
                              currentUpNextTrack = null
                              currentIsUpNext = false
                          }
                          upNextIndex >= 0 -> {
                              currentUpNextTrack = upNextQueue[upNextIndex]
                              upNextQueue = upNextQueue.filterIndexed { index, _ -> index != upNextIndex }
                              currentIsUpNext = true
                          }
                          else -> {
                              // v1/v2 queue snapshots could not represent a currently playing
                              // up-next item because it had already been removed from upNextQueue.
                              currentUpNextTrack = restoredEngineTrack
                              currentIsUpNext = true
                          }
                      }
                  }
                  if (currentQueueTrack()?.id == restoredEngineTrack.id) {
                      updateCurrentTrack(restoredEngineTrack)
                  }
              }

              playbackParts = restoredEngineState.playbackParts
              currentPartIndex = restoredEngineState.currentPartIndex
              playbackState = restoredEngineState.copy(
                  currentTrack = currentQueueTrack() ?: restoredEngineTrack,
                  queue = displayQueue(),
                  queueIndex = displayQueueIndex(),
                  playbackParts = playbackParts,
                  currentPartIndex = currentPartIndex,
              )
          }
          ''',
          )

          replace_once(
              controller,
              '''    private fun persistPlaybackQueue() {
              val snapshot = PlaybackQueueSnapshot(
          ''',
              '''    private fun persistPlaybackQueue() {
              if (!isPlaybackQueueLoaded) return
              val snapshot = PlaybackQueueSnapshot(
          ''',
          )

          replace_once(
              controller,
              '''            isFmQueue = isFmQueue,
              shuffleBeforeFm = shuffleBeforeFm,
          )
          scope.launch {
              playbackQueueStore.save(snapshot)
          }
          ''',
              '''            isFmQueue = isFmQueue,
              shuffleBeforeFm = shuffleBeforeFm,
              currentUpNextTrack = currentUpNextTrack,
