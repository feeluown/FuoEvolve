                      )
                      assertTrue(controller.isShuffleEnabled)
                      assertEquals(RepeatMode.SINGLE, controller.repeatMode)
                      assertEquals(0, queueStore.saveCount)
                      assertNull(engine.lastTrack)
                  } finally {
                      controllerScope.cancel()
                  }
              }

              @Test
