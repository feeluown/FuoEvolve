          }
          ''',
          )

          replace_once(
              android_queue,
              '''    fun flushLatest() {
              latestSnapshot?.let(::writeSnapshot)
          }
          ''',
              '''    override fun flush() {
              latestSnapshot?.let(::writeSnapshot)
