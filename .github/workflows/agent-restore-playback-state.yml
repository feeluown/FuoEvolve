                  )
                  val engine = FakePlaybackEngine().apply {
                      emitState(
                          PlaybackState(
                              status = PlayerStatus.Paused,
                              currentTrack = inserted,
                              positionMs = 42_000,
                              durationMs = 150_000,
                              lyrics = "[00:00.00]restored",
                              playbackParts = listOf(partOne, partTwo),
                              currentPartIndex = 1,
                          ),
                      )
                  }
                  val controllerScope = CoroutineScope(SupervisorJob() + UnconfinedTestDispatcher(testScheduler))
                  try {
                      val controller = FuoPlayerController(
                          providerRepository = FakeProviderRepository(listOf(first, second, inserted, pending)),
                          localRepository = FakeLocalMusicRepository(),
                          downloadRepository = FakeDownloadRepository(emptyMap()),
                          playbackEngine = engine,
                          playbackQueueStore = queueStore,
                          scope = controllerScope,
                      )

                      runCurrent()
                      assertEquals(0, queueStore.saveCount)
                      queueStore.allowLoad.complete(Unit)
                      advanceUntilIdle()

                      assertEquals(PlayerStatus.Paused, controller.playbackState.status)
                      assertEquals("provider:3", controller.playbackState.currentTrack?.id)
                      assertEquals(42_000, controller.playbackState.positionMs)
                      assertEquals(150_000, controller.playbackState.durationMs)
                      assertEquals(listOf(partOne, partTwo), controller.playbackState.playbackParts)
                      assertEquals(1, controller.playbackState.currentPartIndex)
                      assertEquals(
