name: Android Release

"on":
  push:
    tags:
      - "*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run shared tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run shared tests
        run: ./gradlew :shared:allTests

  build-release-apks:
    name: Build signed standard and smart release APKs
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    environment: android-release-build
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      FUO_SIGNING_STORE_FILE: ${{ github.workspace }}/signing/fuo-evolve.jks
      FUO_SIGNING_STORE_PASSWORD: ${{ secrets.FUO_SIGNING_STORE_PASSWORD }}
      FUO_SIGNING_KEY_ALIAS: ${{ secrets.FUO_SIGNING_KEY_ALIAS }}
      FUO_SIGNING_KEY_PASSWORD: ${{ secrets.FUO_SIGNING_KEY_PASSWORD }}
      FUO_SIGNING_KEYSTORE_BASE64: ${{ secrets.FUO_SIGNING_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: https://gradle.com/terms-of-service
          build-scan-terms-of-use-agree: "yes"

      - name: Prepare signing keystore
        run: |
          for name in FUO_SIGNING_KEYSTORE_BASE64 FUO_SIGNING_STORE_PASSWORD FUO_SIGNING_KEY_ALIAS FUO_SIGNING_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required signing secret: ${name}"
              exit 1
            fi
          done
          mkdir -p "$(dirname "$FUO_SIGNING_STORE_FILE")"
          printf '%s' "$FUO_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$FUO_SIGNING_STORE_FILE"

      - name: Build signed release APKs
        run: ./gradlew :androidApp:assembleStandardRelease :androidApp:assembleSmartRelease

      - name: Prepare release APK assets
        id: asset
        env:
          STANDARD_APK_GLOB: androidApp/build/outputs/apk/standard/release/*.apk
          SMART_APK_GLOB: androidApp/build/outputs/apk/smart/release/*.apk
        run: |
          mkdir -p build/artifacts
          tag="${GITHUB_REF_NAME//\//-}"
          mapfile -t standard_apks < <(compgen -G "$STANDARD_APK_GLOB" || true)
          mapfile -t smart_apks < <(compgen -G "$SMART_APK_GLOB" || true)
          if [ "${#standard_apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one standard release APK, found ${#standard_apks[@]}"
            printf '%s\n' "${standard_apks[@]}"
            exit 1
          fi
          if [ "${#smart_apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one smart release APK, found ${#smart_apks[@]}"
            printf '%s\n' "${smart_apks[@]}"
            exit 1
          fi
          standard_path="build/artifacts/fuo-evolve-${tag}-android-signed.apk"
          smart_path="build/artifacts/fuo-evolve-${tag}-android-smart-signed.apk"
          cp "${standard_apks[0]}" "$standard_path"
          cp "${smart_apks[0]}" "$smart_path"
          echo "standard_path=$standard_path" >> "$GITHUB_OUTPUT"
          echo "smart_path=$smart_path" >> "$GITHUB_OUTPUT"

      - name: Verify release APK identities and flavor isolation
        env:
          STANDARD_APK: ${{ steps.asset.outputs.standard_path }}
          SMART_APK: ${{ steps.asset.outputs.smart_path }}
        run: bash scripts/verify-android-flavor-apks.sh "$STANDARD_APK" "$SMART_APK"

      - name: Upload standard release APK asset
        uses: actions/upload-artifact@v7
        with:
          name: android-standard-release-apk
          path: ${{ steps.asset.outputs.standard_path }}
          archive: false
          if-no-files-found: error

      - name: Upload smart release APK asset
        uses: actions/upload-artifact@v7
        with:
          name: android-smart-release-apk
          path: ${{ steps.asset.outputs.smart_path }}
          archive: false
          if-no-files-found: error

  publish-release:
    name: Publish signed release APKs
    needs: build-release-apks
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: android-release
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release APK assets
        uses: actions/download-artifact@v8
        with:
          pattern: android-*-release-apk
          path: build/artifacts
          merge-multiple: true

      - name: Verify release APK assets
        run: |
          tag="${GITHUB_REF_NAME//\//-}"
          standard_asset="build/artifacts/fuo-evolve-${tag}-android-signed.apk"
          smart_asset="build/artifacts/fuo-evolve-${tag}-android-smart-signed.apk"
          for asset in "$standard_asset" "$smart_asset"; do
            if [ ! -f "$asset" ]; then
              echo "::error::Missing release APK asset: $asset"
              exit 1
            fi
          done
          mapfile -t apks < <(find build/artifacts -maxdepth 1 -type f -name '*.apk' -print)
          if [ "${#apks[@]}" -ne 2 ]; then
            echo "::error::Expected exactly two release APK assets, found ${#apks[@]}"
            printf '%s\n' "${apks[@]}"
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/artifacts/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true

  publish-fdroid-pages:
    name: Publish F-Droid repository to Pages
    needs: publish-release
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
      needs.publish-release.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      FUO_SIGNING_KEYSTORE_BASE64: ${{ secrets.FUO_SIGNING_KEYSTORE_BASE64 }}
      FUO_SIGNING_STORE_PASSWORD: ${{ secrets.FUO_SIGNING_STORE_PASSWORD }}
      FUO_SIGNING_KEY_ALIAS: ${{ secrets.FUO_SIGNING_KEY_ALIAS }}
      FUO_SIGNING_KEY_PASSWORD: ${{ secrets.FUO_SIGNING_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      FDROID_DOCKER_IMAGE: registry.gitlab.com/fdroid/docker-executable-fdroidserver:master

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build F-Droid repository and Pages site
        run: |
          docker pull "$FDROID_DOCKER_IMAGE"
          bash scripts/build-fdroid-pages.sh

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
