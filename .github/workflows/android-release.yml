name: Android Release

"on":
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  build-release-apks:
    name: Build signed multi-ABI release APK
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: android-release-build
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      FUO_SIGNING_STORE_FILE: ${{ github.workspace }}/signing/fuo-evolve.jks
      FUO_SIGNING_STORE_PASSWORD: ${{ secrets.FUO_SIGNING_STORE_PASSWORD }}
      FUO_SIGNING_KEY_ALIAS: ${{ secrets.FUO_SIGNING_KEY_ALIAS }}
      FUO_SIGNING_KEY_PASSWORD: ${{ secrets.FUO_SIGNING_KEY_PASSWORD }}
      FUO_SIGNING_KEYSTORE_BASE64: ${{ secrets.FUO_SIGNING_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: https://gradle.com/terms-of-service
          build-scan-terms-of-use-agree: "yes"

      - name: Prepare signing keystore
        run: |
          for name in FUO_SIGNING_KEYSTORE_BASE64 FUO_SIGNING_STORE_PASSWORD FUO_SIGNING_KEY_ALIAS FUO_SIGNING_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required signing secret: ${name}"
              exit 1
            fi
          done
          mkdir -p "$(dirname "$FUO_SIGNING_STORE_FILE")"
          printf '%s' "$FUO_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$FUO_SIGNING_STORE_FILE"

      - name: Build signed release APK
        run: ./gradlew :androidApp:assembleRelease

      - name: Prepare release APK asset
        id: asset
        env:
          RELEASE_APK_GLOB: androidApp/build/outputs/apk/release/*.apk
        run: |
          mkdir -p build/artifacts
          tag="${GITHUB_REF_NAME//\//-}"
          mapfile -t apks < <(compgen -G "$RELEASE_APK_GLOB" || true)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one multi-ABI release APK, found ${#apks[@]}"
            printf '%s\n' "${apks[@]}"
            exit 1
          fi
          asset_path="build/artifacts/fuo-evolve-${tag}-android-signed.apk"
          cp "${apks[0]}" "$asset_path"
          echo "path=$asset_path" >> "$GITHUB_OUTPUT"

      - name: Upload release APK asset
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.asset.outputs.path }}
          archive: false
          if-no-files-found: error

  publish-release:
    name: Publish signed release APKs
    needs: build-release-apks
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: android-release
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release APK assets
        uses: actions/download-artifact@v8
        with:
          pattern: fuo-evolve-*-android-signed.apk
          path: build/artifacts
          merge-multiple: true

      - name: Verify release APK assets
        run: |
          tag="${GITHUB_REF_NAME//\//-}"
          asset="build/artifacts/fuo-evolve-${tag}-android-signed.apk"
          if [ ! -f "$asset" ]; then
            echo "::error::Missing release APK asset: $asset"
            exit 1
          fi
          mapfile -t apks < <(find build/artifacts -maxdepth 1 -type f -name '*.apk' -print)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one release APK asset, found ${#apks[@]}"
            printf '%s\n' "${apks[@]}"
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/artifacts/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true

  publish-fdroid-pages:
    name: Publish F-Droid repository to Pages
    needs: publish-release
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
      needs.publish-release.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      FUO_SIGNING_KEYSTORE_BASE64: ${{ secrets.FUO_SIGNING_KEYSTORE_BASE64 }}
      FUO_SIGNING_STORE_PASSWORD: ${{ secrets.FUO_SIGNING_STORE_PASSWORD }}
      FUO_SIGNING_KEY_ALIAS: ${{ secrets.FUO_SIGNING_KEY_ALIAS }}
      FUO_SIGNING_KEY_PASSWORD: ${{ secrets.FUO_SIGNING_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      FDROID_DOCKER_IMAGE: registry.gitlab.com/fdroid/docker-executable-fdroidserver:master

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build F-Droid repository and Pages site
        run: |
          docker pull "$FDROID_DOCKER_IMAGE"
          bash scripts/build-fdroid-pages.sh

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
