name: iOS Tests

"on":
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Run iOS simulator tests
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare Git refs for Gradle versioning
        run: |
          if ! git show-ref --verify --quiet refs/heads/master; then
            git branch master origin/master
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: never

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ runner.arch }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Run iOS simulator target tests
        run: >-
          ./gradlew
          :feature:recognition:iosSimulatorArm64Test
          :feature:search:iosSimulatorArm64Test
          :feature:localplaylist:iosSimulatorArm64Test
          :feature:localmusic:iosSimulatorArm64Test
          :feature:download:iosSimulatorArm64Test
          :feature:providercatalog:iosSimulatorArm64Test
          :feature:providerauth:iosSimulatorArm64Test
          :feature:providerdetail:iosSimulatorArm64Test
          :feature:settings:iosSimulatorArm64Test
          :feature:onboarding:iosSimulatorArm64Test
          :feature:home:iosSimulatorArm64Test
          :feature:playback:iosSimulatorArm64Test
          :playback:runtime:iosSimulatorArm64Test
          :provider:runtime:iosSimulatorArm64Test
          :shared:iosSimulatorArm64Test
