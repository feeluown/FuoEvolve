name: Nucleus Desktop Packaging

"on":
  workflow_call:
    inputs:
      checkout_ref:
        description: Git ref or SHA to package
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64 NSIS
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      FUOEVOLVE_NUCLEUS_LIBMPV_DEV_DIR: ${{ github.workspace }}\build\nucleus-native\windows\mpv
      FUOEVOLVE_NUCLEUS_LIBMPV_RUNTIME_DIR: ${{ github.workspace }}\build\nucleus-native\windows\mpv

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Prepare Git refs for versioning
        shell: pwsh
        run: |
          git show-ref --verify --quiet refs/heads/master
          if ($LASTEXITCODE -ne 0) {
            git branch master origin/master
          }

      - name: Set up Nucleus GraalVM toolchain
        uses: ./.github/actions/setup-nucleus
        with:
          java-version: "25"
          graalvm: "true"
          packaging-tools: "false"
          setup-node: "true"

      - name: Set up Rust 1.98.1
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Cache Rust native helpers
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktopApp/native/audio-fingerprint/target
            desktopApp/native/audio-capture/target
          key: nucleus-native-windows-x64-rust-1.98.1-${{ hashFiles('desktopApp/native/audio-fingerprint/Cargo.toml', 'desktopApp/native/audio-fingerprint/src/**', 'shared/src/commonMain/resources/audio_recognition/afp.wasm', 'desktopApp/native/audio-capture/Cargo.toml', 'desktopApp/native/audio-capture/Cargo.lock', 'desktopApp/native/audio-capture/src/**') }}
          restore-keys: |
            nucleus-native-windows-x64-rust-1.98.1-

      - name: Cache pinned Windows libmpv bundle
        id: windows-libmpv-cache
        uses: actions/cache@v6
        with:
          path: build/nucleus-native/windows/mpv
          key: nucleus-libmpv-windows-x64-${{ hashFiles('desktopApp/packaging/native-deps.lock') }}

      - name: Prepare pinned Windows libmpv development bundle
        shell: pwsh
        env:
          LIBMPV_CACHE_HIT: ${{ steps.windows-libmpv-cache.outputs.cache-hit }}
        run: |
          if ($env:LIBMPV_CACHE_HIT -ne "true") {
            ./desktopApp/packaging/windows/prepare-libmpv-dev.ps1 `
              -OutputDir "$env:FUOEVOLVE_NUCLEUS_LIBMPV_DEV_DIR"
          }

      - name: Build Nucleus Native Image NSIS installer
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          clang --version
          lld-link --version
          .\gradlew.bat `
            --no-daemon `
            --no-configuration-cache `
            --warning-mode all `
            --stacktrace `
            -PnativeMarch=compatibility `
            :desktopApp:packageGraalvmNsis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare Windows artifact
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem -Path desktopApp\build\compose\binaries -Recurse -File -Filter *.exe |
            Where-Object { $_.FullName -match '[\\/]graalvm-nsis[\\/]' }
          if ($artifacts.Count -ne 1) {
            Write-Host "Expected exactly one NSIS installer, found $($artifacts.Count)"
            $artifacts | Select-Object FullName, Length
            exit 1
          }
          New-Item -ItemType Directory -Force -Path build\artifacts | Out-Null
          Copy-Item $artifacts[0].FullName build\artifacts\FuoEvolve-windows-x64.exe
          Get-Item build\artifacts\FuoEvolve-windows-x64.exe | Select-Object Name, Length

      - name: Upload Windows NSIS installer
        uses: actions/upload-artifact@v7
        with:
          name: FuoEvolve-windows-x64-nsis
          path: build/artifacts/FuoEvolve-windows-x64.exe
          archive: false
          retention-days: 14
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }} DMG
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      FUOEVOLVE_NUCLEUS_LIBMPV_DEV_DIR: ${{ github.workspace }}/build/nucleus-native/macos/mpv
      FUOEVOLVE_NUCLEUS_LIBMPV_RUNTIME_DIR: ${{ github.workspace }}/build/nucleus-native/macos/mpv
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            uname_arch: arm64
          - arch: x64
            runner: macos-15-intel
            uname_arch: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.uname_arch }}"

      - name: Prepare Git refs for versioning
        run: |
          if ! git show-ref --verify --quiet refs/heads/master; then
            git branch master origin/master
          fi

      - name: Set up Nucleus GraalVM toolchain
        uses: ./.github/actions/setup-nucleus
        with:
          java-version: "25"
          graalvm: "true"
          packaging-tools: "false"
          setup-node: "true"

      - name: Set up Rust 1.98.1
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Cache Rust native helpers
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktopApp/native/audio-fingerprint/target
            desktopApp/native/audio-capture/target
          key: nucleus-native-macos-${{ matrix.arch }}-rust-1.98.1-${{ hashFiles('desktopApp/native/audio-fingerprint/Cargo.toml', 'desktopApp/native/audio-fingerprint/src/**', 'shared/src/commonMain/resources/audio_recognition/afp.wasm', 'desktopApp/native/audio-capture/Cargo.toml', 'desktopApp/native/audio-capture/Cargo.lock', 'desktopApp/native/audio-capture/src/**') }}
          restore-keys: |
            nucleus-native-macos-${{ matrix.arch }}-rust-1.98.1-

      - name: Cache relocatable macOS libmpv bundle
        id: macos-libmpv-cache
        uses: actions/cache@v6
        with:
          path: build/nucleus-native/macos/mpv
          key: nucleus-libmpv-macos-${{ matrix.arch }}-${{ hashFiles('desktopApp/packaging/native-deps.lock', 'desktopApp/packaging/macos/prepare-libmpv.sh') }}

      - name: Prepare relocatable macOS libmpv runtime
        env:
          LIBMPV_CACHE_HIT: ${{ steps.macos-libmpv-cache.outputs.cache-hit }}
        run: |
          if [[ "$LIBMPV_CACHE_HIT" != "true" ]]; then
            bash desktopApp/packaging/macos/prepare-libmpv.sh \
              "${{ github.workspace }}/build/nucleus-native/macos/mpv"
          fi

      - name: Verify cached macOS libmpv bundle
        run: |
          test -f "$FUOEVOLVE_NUCLEUS_LIBMPV_DEV_DIR/include/mpv/client.h"
          test -f "$FUOEVOLVE_NUCLEUS_LIBMPV_RUNTIME_DIR/libmpv.dylib"
          while IFS= read -r dylib; do
            if otool -L "$dylib" | tail -n +2 | grep -E '/(opt/homebrew|usr/local)/(Cellar|opt)/' >/dev/null; then
              echo "Cached macOS libmpv bundle is not relocatable: $dylib" >&2
              exit 1
            fi
            duplicate_count="$(otool -l "$dylib" | awk '$1 == "cmd" && $2 == "LC_RPATH" { r=1; next } r && $1 == "path" { if ($2 == "@loader_path/") c++; r=0 } END { print c+0 }')"
            if [[ "$duplicate_count" -gt 1 ]]; then
              echo "Cached macOS dylib contains duplicate @loader_path/ LC_RPATH entries: $dylib" >&2
              exit 1
            fi
          done < <(find "$FUOEVOLVE_NUCLEUS_LIBMPV_RUNTIME_DIR" -maxdepth 1 -type f -name '*.dylib' -print)

      - name: Build Nucleus Native Image DMG
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./gradlew \
            --no-daemon \
            --no-configuration-cache \
            --warning-mode all \
            --stacktrace \
            -PnativeMarch=compatibility \
            -Pfuoevolve.nucleus.targetFormat=dmg \
            :desktopApp:packageGraalvmDmg

      - name: Verify macOS package closure
        run: |
          BRIDGE="$(find desktopApp/build/compose/binaries -type f -name 'libfuoevolve_mpv_bridge.dylib' -print -quit)"
          MPV="$(find desktopApp/build/compose/binaries -type f -name 'libmpv.dylib' -print -quit)"
          AUDIO="$(find desktopApp/build/compose/binaries -type f -name 'libfuoevolve_audio_capture.dylib' -print -quit)"
          HELPER="$(find desktopApp/build/compose/binaries -type f -name 'fuoevolve-audio-fingerprint' -print -quit)"
          PLIST="$(find desktopApp/build/compose/binaries -type f -path '*.app/Contents/Info.plist' -print -quit)"
          test -n "$BRIDGE" && test -n "$MPV" && test -n "$AUDIO" && test -n "$HELPER" && test -n "$PLIST"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$PLIST")" = "org.feeluown.mobile.desktop"
          test "$(plutil -extract NSMicrophoneUsageDescription raw -o - "$PLIST")" = "FuoEvolve 使用麦克风进行听歌识曲。"
          test "$(plutil -extract NSAudioCaptureUsageDescription raw -o - "$PLIST")" = "FuoEvolve 使用系统音频进行听歌识曲。"
          if otool -L "$BRIDGE" "$MPV" "$AUDIO" | grep -E '/(opt/homebrew|usr/local)/(Cellar|opt)/'; then
            echo "Nucleus macOS package still references Homebrew" >&2
            exit 1
          fi

      - name: Prepare macOS artifact
        run: |
          artifact_count="$(find desktopApp/build -type f -name '*.dmg' -print | wc -l | tr -d ' ')"
          if [[ "$artifact_count" -ne 1 ]]; then
            echo "Expected exactly one DMG, found $artifact_count" >&2
            find desktopApp/build -type f -name '*.dmg' -print >&2
            exit 1
          fi
          artifact="$(find desktopApp/build -type f -name '*.dmg' -print -quit)"
          mkdir -p build/artifacts
          cp "$artifact" "build/artifacts/FuoEvolve-macos-${{ matrix.arch }}.dmg"
          du -h "build/artifacts/FuoEvolve-macos-${{ matrix.arch }}.dmg"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v7
        with:
          name: FuoEvolve-macos-${{ matrix.arch }}-dmg
          path: build/artifacts/FuoEvolve-macos-${{ matrix.arch }}.dmg
          archive: false
          retention-days: 14
          if-no-files-found: error

  linux-x64:
    name: Linux x64 ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: appimage
            label: AppImage
            bundle_runtime: "true"
            gradle_tasks: ":desktopApp:packageGraalvmAppImage"
          - variant: distro
            label: DEB + RPM + Arch
            bundle_runtime: "false"
            gradle_tasks: ":desktopApp:packageGraalvmDeb :desktopApp:packageGraalvmRpm :desktopApp:packageGraalvmPacman"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Verify Linux LTS baseline
        run: |
          . /etc/os-release
          test "$ID" = "ubuntu"
          test "$VERSION_ID" = "24.04"
          echo "Building Linux ${{ matrix.label }} against Ubuntu $VERSION_ID LTS baseline"

      - name: Prepare Git refs for versioning
        run: |
          if ! git show-ref --verify --quiet refs/heads/master; then
            git branch master origin/master
          fi

      - name: Set up Nucleus GraalVM toolchain
        uses: ./.github/actions/setup-nucleus
        with:
          java-version: "25"
          graalvm: "true"
          packaging-tools: "true"
          setup-node: "true"

      - name: Set up Rust 1.98.1
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Cache Rust native helpers
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktopApp/native/audio-fingerprint/target
            desktopApp/native/audio-capture/target
          key: nucleus-native-linux-ubuntu24.04-x64-${{ matrix.variant }}-rust-1.98.1-${{ hashFiles('desktopApp/native/audio-fingerprint/Cargo.toml', 'desktopApp/native/audio-fingerprint/src/**', 'shared/src/commonMain/resources/audio_recognition/afp.wasm', 'desktopApp/native/audio-capture/Cargo.toml', 'desktopApp/native/audio-capture/Cargo.lock', 'desktopApp/native/audio-capture/src/**') }}
          restore-keys: |
            nucleus-native-linux-ubuntu24.04-x64-${{ matrix.variant }}-rust-1.98.1-
            nucleus-native-linux-ubuntu24.04-x64-rust-1.98.1-

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            binutils \
            file \
            libfuse2t64 \
            libasound2-dev \
            libmpv-dev \
            libpipewire-0.3-dev \
            libpulse-dev \
            libsecret-1-dev \
            libwebkit2gtk-4.1-dev \
            glib-networking \
            libarchive-tools \
            patchelf \
            pax-utils \
            xz-utils \
            zstd

      - name: Build Linux Native Image and package ${{ matrix.label }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./gradlew \
            --no-daemon \
            --no-configuration-cache \
            --warning-mode all \
            --stacktrace \
            -PnativeMarch=compatibility \
            -Pfuoevolve.nucleus.bundleLinuxRuntime=${{ matrix.bundle_runtime }} \
            ${{ matrix.gradle_tasks }}

      - name: Prepare and verify AppImage
        if: matrix.variant == 'appimage'
        run: |
          mapfile -t appimages < <(find desktopApp/build -type f -iname '*.AppImage' -print)
          if [[ "${#appimages[@]}" -ne 1 ]]; then
            echo "Expected exactly one AppImage, found ${#appimages[@]}" >&2
            printf '%s\n' "${appimages[@]}" >&2
            exit 1
          fi
          mkdir -p build/artifacts build/appimage-verify
          cp "${appimages[0]}" build/artifacts/FuoEvolve-linux-x64.AppImage
          chmod +x build/artifacts/FuoEvolve-linux-x64.AppImage

          (
            cd build/appimage-verify
            ../artifacts/FuoEvolve-linux-x64.AppImage --appimage-extract >/dev/null
            ROOT=squashfs-root
            find "$ROOT" -type f -name libfuoevolve_mpv_bridge.so -print -quit | grep -q .
            find "$ROOT" -type f -name libfuoevolve_audio_capture.so -print -quit | grep -q .
            find "$ROOT" -type f -name 'libmpv.so*' -print -quit | grep -q .
            find "$ROOT" -type f -name fuoevolve-audio-fingerprint -print -quit | grep -q .
            find "$ROOT" -type f -name WebKitNetworkProcess -print -quit | grep -q .
            find "$ROOT" -type f -name libgiognutls.so -print -quit | grep -q .
            test -x "$ROOT/AppRun"
            test -d "$ROOT/native/webview/lib"
            test -x "$ROOT/native/webview/webkit2gtk-4.1/WebKitNetworkProcess"
            test -f "$ROOT/native/webview/webkit2gtk-4.1/injected-bundle/libwebkit2gtkinjectedbundle.so"
            test -f "$ROOT/native/webview/gio/modules/libgiognutls.so"
            grep -Fq 'native/webview/lib' "$ROOT/AppRun"
            grep -Fq 'WEBKIT_EXEC_PATH' "$ROOT/AppRun"
            grep -Fq 'WEBKIT_INJECTED_BUNDLE_PATH' "$ROOT/AppRun"
            grep -Fq 'GIO_EXTRA_MODULES' "$ROOT/AppRun"
            grep -Fq 'exec "$APPDIR/fuoevolve" "$@"' "$ROOT/AppRun"
            if find "$ROOT/native" -type f -name 'libmvec.so*' -print -quit | grep -q .; then
              echo "AppImage must not bundle glibc libmvec" >&2
              exit 1
            fi
            bash "$GITHUB_WORKSPACE/desktopApp/packaging/linux/verify-x86-64-baseline.sh" "$ROOT"
          )

          du -h build/artifacts/FuoEvolve-linux-x64.AppImage

      - name: Prepare and verify DEB, RPM and Arch packages
        if: matrix.variant == 'distro'
        run: |
          mapfile -t deb_packages < <(find desktopApp/build -type f -name '*.deb' -print)
          if [[ "${#deb_packages[@]}" -ne 1 ]]; then
            echo "Expected exactly one DEB package, found ${#deb_packages[@]}" >&2
            printf '%s\n' "${deb_packages[@]}" >&2
            exit 1
          fi

          mapfile -t rpm_packages < <(find desktopApp/build -type f -name '*.rpm' -print)
          if [[ "${#rpm_packages[@]}" -ne 1 ]]; then
            echo "Expected exactly one RPM package, found ${#rpm_packages[@]}" >&2
            printf '%s\n' "${rpm_packages[@]}" >&2
            exit 1
          fi

          mapfile -t arch_packages < <(find desktopApp/build -type f \( -name '*.pacman' -o -name '*.pkg.tar.xz' -o -name '*.pkg.tar.zst' \) -print)
          if [[ "${#arch_packages[@]}" -ne 1 ]]; then
            echo "Expected exactly one Arch/pacman package, found ${#arch_packages[@]}" >&2
            printf '%s\n' "${arch_packages[@]}" >&2
            exit 1
          fi

          mkdir -p build/artifacts
          cp "${deb_packages[0]}" build/artifacts/FuoEvolve-linux-x64.deb
          cp "${rpm_packages[0]}" build/artifacts/FuoEvolve-linux-x64.rpm

          arch_package="${arch_packages[0]}"
          arch_artifact=build/artifacts/FuoEvolve-linux-x64.pkg.tar.zst
          if zstd -t "$arch_package" >/dev/null 2>&1; then
            cp "$arch_package" "$arch_artifact"
          elif xz -t "$arch_package" >/dev/null 2>&1; then
            xz -dc "$arch_package" | zstd -q -T0 -19 -c > "$arch_artifact"
          else
            echo "Unsupported Arch package compression: $arch_package" >&2
            file "$arch_package" >&2 || true
            exit 1
          fi
          zstd -t "$arch_artifact"

          test "$(dpkg-deb -f build/artifacts/FuoEvolve-linux-x64.deb Package)" = "fuoevolve"
          dpkg-deb -f build/artifacts/FuoEvolve-linux-x64.deb Depends | tee build/deb-depends.txt
          for dep in \
            libgtk-3-0t64 \
            libx11-6 \
            libxkbcommon0 \
            libsecret-1-0 \
            libmpv2 \
            libwebkit2gtk-4.1-0 \
            libasound2t64 \
            libpipewire-0.3-0t64 \
            libpulse0; do
            grep -Fq "$dep" build/deb-depends.txt || {
              echo "DEB dependency metadata is missing $dep" >&2
              exit 1
            }
          done
          dpkg-deb -c build/artifacts/FuoEvolve-linux-x64.deb | grep -E 'libfuoevolve_mpv_bridge\.so$' >/dev/null
          dpkg-deb -c build/artifacts/FuoEvolve-linux-x64.deb | grep -E 'libfuoevolve_audio_capture\.so$' >/dev/null
          dpkg-deb -c build/artifacts/FuoEvolve-linux-x64.deb | grep 'fuoevolve-audio-fingerprint' >/dev/null
          rm -rf build/deb-verify
          mkdir -p build/deb-verify
          dpkg-deb -x build/artifacts/FuoEvolve-linux-x64.deb build/deb-verify
          bash desktopApp/packaging/linux/verify-x86-64-baseline.sh build/deb-verify
          if dpkg-deb -c build/artifacts/FuoEvolve-linux-x64.deb | grep -E '(^|/)libmpv\.so([.0-9]*)?$|WebKitNetworkProcess$|libwebkit2gtk-4\.1\.so'; then
            echo "DEB unexpectedly bundles portable Linux runtime libraries" >&2
            exit 1
          fi

          test "$(rpm -qp --queryformat '%{NAME}\n' build/artifacts/FuoEvolve-linux-x64.rpm)" = "fuoevolve"
          rpm -qpR build/artifacts/FuoEvolve-linux-x64.rpm | tee build/rpm-requires.txt
          for dep in \
            gtk3 \
            libX11 \
            libxkbcommon \
            libsecret \
            mpv-libs \
            webkit2gtk4.1 \
            alsa-lib \
            pipewire-libs \
            pulseaudio-libs; do
            grep -Eq "^${dep}($|[[:space:]<>=])" build/rpm-requires.txt || {
              echo "RPM dependency metadata is missing $dep" >&2
              exit 1
            }
          done
          rpm -qpl build/artifacts/FuoEvolve-linux-x64.rpm | grep -E 'libfuoevolve_mpv_bridge\.so$' >/dev/null
          rpm -qpl build/artifacts/FuoEvolve-linux-x64.rpm | grep -E 'libfuoevolve_audio_capture\.so$' >/dev/null
          rpm -qpl build/artifacts/FuoEvolve-linux-x64.rpm | grep 'fuoevolve-audio-fingerprint' >/dev/null
          if rpm -qpl build/artifacts/FuoEvolve-linux-x64.rpm | grep -E '(^|/)libmpv\.so([.0-9]*)?$|WebKitNetworkProcess$|libwebkit2gtk-4\.1\.so'; then
            echo "RPM unexpectedly bundles portable Linux runtime libraries" >&2
            exit 1
          fi

          bsdtar -xOf build/artifacts/FuoEvolve-linux-x64.pkg.tar.zst .PKGINFO | tee build/arch-pkginfo.txt
          grep -Eq '^depend = mpv($|[<>=])' build/arch-pkginfo.txt
          grep -Eq '^depend = libsecret($|[<>=])' build/arch-pkginfo.txt
          grep -Eq '^depend = webkit2gtk-4.1($|[<>=])' build/arch-pkginfo.txt
          grep -Eq '^depend = alsa-lib($|[<>=])' build/arch-pkginfo.txt
          grep -Eq '^depend = pipewire($|[<>=])' build/arch-pkginfo.txt
          grep -Eq '^depend = libpulse($|[<>=])' build/arch-pkginfo.txt
          bsdtar -tf build/artifacts/FuoEvolve-linux-x64.pkg.tar.zst | grep -E 'libfuoevolve_mpv_bridge\.(so|dll|dylib)$' >/dev/null
          bsdtar -tf build/artifacts/FuoEvolve-linux-x64.pkg.tar.zst | grep -E 'libfuoevolve_audio_capture\.so$' >/dev/null
          bsdtar -tf build/artifacts/FuoEvolve-linux-x64.pkg.tar.zst | grep 'fuoevolve-audio-fingerprint' >/dev/null
          if bsdtar -tf build/artifacts/FuoEvolve-linux-x64.pkg.tar.zst | grep -E '(^|/)libmpv\.so([.0-9]*)?$|WebKitNetworkProcess$|libwebkit2gtk-4\.1\.so'; then
            echo "Arch package unexpectedly bundles portable Linux runtime libraries" >&2
            exit 1
          fi

          du -h build/artifacts/FuoEvolve-linux-x64.deb
          du -h build/artifacts/FuoEvolve-linux-x64.rpm
          du -h build/artifacts/FuoEvolve-linux-x64.pkg.tar.zst

      - name: Upload Linux AppImage
        if: matrix.variant == 'appimage'
        uses: actions/upload-artifact@v7
        with:
          name: FuoEvolve-linux-x64-appimage
          path: build/artifacts/FuoEvolve-linux-x64.AppImage
          archive: false
          retention-days: 14
          if-no-files-found: error

      - name: Upload Debian package
        if: matrix.variant == 'distro'
        uses: actions/upload-artifact@v7
        with:
          name: FuoEvolve-linux-x64-deb
          path: build/artifacts/FuoEvolve-linux-x64.deb
          archive: false
          retention-days: 14
          if-no-files-found: error

      - name: Upload RPM package
        if: matrix.variant == 'distro'
        uses: actions/upload-artifact@v7
        with:
          name: FuoEvolve-linux-x64-rpm
          path: build/artifacts/FuoEvolve-linux-x64.rpm
          archive: false
          retention-days: 14
          if-no-files-found: error

      - name: Upload Arch Linux package
        if: matrix.variant == 'distro'
        uses: actions/upload-artifact@v7
        with:
          name: FuoEvolve-linux-x64-arch
          path: build/artifacts/FuoEvolve-linux-x64.pkg.tar.zst
          archive: false
          retention-days: 14
          if-no-files-found: error