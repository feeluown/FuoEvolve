name: Android Tests

"on":
  workflow_call:
    secrets:
      GRADLE_ENCRYPTION_KEY:
        required: false

permissions:
  contents: read

jobs:
  test:
    name: Run Android tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare Git refs for Gradle versioning
        run: |
          if ! git show-ref --verify --quiet refs/heads/master; then
            git branch master origin/master
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          add-job-summary: never

      - name: Run architecture checks
        run: >-
          ./gradlew
          --no-configuration-cache
          --warning-mode all
          ciArchitectureCheck

      - name: Run Android tests, coverage and app compile validation
        run: >-
          ./gradlew
          --configuration-cache
          --warning-mode all
          ciAndroidTest
          ciCoverage

      - name: Write test and coverage summary
        if: always()
        env:
          COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/master' }}
        run: python3 tools/ci/coverage_report.py --base "$COVERAGE_BASE"
