name: Android Tests

"on":
  workflow_call:
    inputs:
      validate_android_app:
        required: false
        type: boolean
        default: false
    secrets:
      GRADLE_ENCRYPTION_KEY:
        required: false

permissions:
  contents: read

jobs:
  test:
    name: Run Android tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare Git refs for Gradle versioning
        run: |
          if ! git show-ref --verify --quiet refs/heads/master; then
            git branch master origin/master
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Run architecture checks
        run: >-
          ./gradlew
          --no-configuration-cache
          --warning-mode all
          checkArchitectureBoundaries
          :feature:download:checkOfflineFeatureBoundaries
          :feature:providerauth:checkProviderFeatureBoundaries
          :feature:providerdetail:checkProviderDetailFeatureBoundaries
          :feature:settings:checkSettingsFeatureBoundaries
          :feature:onboarding:checkOnboardingFeatureBoundaries
          :feature:home:checkHomeFeatureBoundaries
          :feature:playback:checkPlaybackFeatureBoundaries
          :shared:checkP4ContractBoundaries

      - name: Run Android unit tests, coverage and PR compile validation
        env:
          VALIDATE_ANDROID_APP: ${{ inputs.validate_android_app }}
        run: |
          tasks=(
            :feature:recognition:testAndroidHostTest
            :feature:search:testAndroidHostTest
            :feature:localplaylist:testAndroidHostTest
            :feature:localmusic:testAndroidHostTest
            :feature:download:testAndroidHostTest
            :feature:providercatalog:testAndroidHostTest
            :feature:providerauth:testAndroidHostTest
            :feature:providerdetail:testAndroidHostTest
            :feature:settings:testAndroidHostTest
            :feature:onboarding:testAndroidHostTest
            :feature:home:testAndroidHostTest
            :feature:playback:testAndroidHostTest
            :playback:runtime:testAndroidHostTest
            :provider:runtime:testAndroidHostTest
            :persistence:settings:testAndroidHostTest
            :provider:bilibili:testAndroidHostTest
            :provider:netease:testAndroidHostTest
            :provider:qqmusic:testAndroidHostTest
            :provider:ytmusic:testAndroidHostTest
            :shared:testAndroidHostTest
            :shared:koverXmlReport
          )

          if [ "$VALIDATE_ANDROID_APP" = "true" ]; then
            tasks+=(
              :androidApp:checkReleaseAarMetadata
              :androidApp:compileDebugKotlin
              :androidApp:compileDebugJavaWithJavac
              :androidApp:processDebugResources
            )
          fi

          ./gradlew --configuration-cache --warning-mode all "${tasks[@]}"
