name: Run playlist permissions patch

on:
  push:
    branches:
      - feat/playlist-permissions-qq-mutations

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/playlist-permissions-qq-mutations
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply embedded patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/apply-playlist-permissions-patch.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if line.strip() == "python3 - <<'PY'") + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in workflow[start:end])
          exec(compile(script, '<playlist-permissions-patch>', 'exec'))
          PY
      - name: Run shared tests
        run: ./gradlew :shared:allTests --no-daemon
      - name: Commit implementation
        run: |
          rm .github/workflows/apply-playlist-permissions-patch.yml
          rm .github/workflows/run-playlist-permissions-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add playlist permissions and QQ mutations [skip ci]"
          git push origin HEAD:feat/playlist-permissions-qq-mutations
