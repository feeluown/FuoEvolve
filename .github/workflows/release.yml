name: Release

"on":
  push:
    tags:
      - "[0-9]*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-preflight:
    name: Validate release identity
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate release tag and versionCode progression
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version_pattern='^[0-9]+(\.[0-9]+){2,3}
    name: Android tests
    if: github.event_name == 'push'
    uses: ./.github/workflows/android-tests.yml
    secrets:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

  desktop-tests:
    name: Desktop tests
    if: github.event_name == 'push'
    uses: ./.github/workflows/desktop-tests.yml

  ios-tests:
    name: iOS tests
    if: github.event_name == 'push'
    uses: ./.github/workflows/ios-tests.yml

  build-android-release:
    name: Build signed Android release APK
    if: github.event_name == 'push'
    needs:
      - android-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FUO_SIGNING_STORE_FILE: ${{ github.workspace }}/signing/fuo-evolve.jks
      FUO_SIGNING_STORE_PASSWORD: ${{ secrets.FUO_SIGNING_STORE_PASSWORD }}
      FUO_SIGNING_KEY_ALIAS: ${{ secrets.FUO_SIGNING_KEY_ALIAS }}
      FUO_SIGNING_KEY_PASSWORD: ${{ secrets.FUO_SIGNING_KEY_PASSWORD }}
      FUO_SIGNING_KEYSTORE_BASE64: ${{ secrets.FUO_SIGNING_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare Git refs for Gradle versioning
        run: |
          if ! git show-ref --verify --quiet refs/heads/master; then
            git branch master origin/master
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          build-scan-publish: true
          build-scan-terms-of-use-url: https://gradle.com/terms-of-service
          build-scan-terms-of-use-agree: "yes"
          add-job-summary: never

      - name: Prepare signing keystore
        run: |
          for name in FUO_SIGNING_KEYSTORE_BASE64 FUO_SIGNING_STORE_PASSWORD FUO_SIGNING_KEY_ALIAS FUO_SIGNING_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required signing secret: ${name}"
              exit 1
            fi
          done
          mkdir -p "$(dirname "$FUO_SIGNING_STORE_FILE")"
          printf '%s' "$FUO_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$FUO_SIGNING_STORE_FILE"

      - name: Build signed release APK
        env:
          GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
        run: |
          if [ -n "$GRADLE_ENCRYPTION_KEY" ]; then
            echo "Using Gradle configuration cache."
            ./gradlew --configuration-cache :androidApp:assembleRelease
          else
            echo "::warning::GRADLE_ENCRYPTION_KEY is not configured; configuration cache persistence is disabled."
            ./gradlew --no-configuration-cache :androidApp:assembleRelease
          fi

      - name: Prepare release APK asset
        id: asset
        env:
          RELEASE_APK_GLOB: androidApp/build/outputs/apk/release/*.apk
        run: |
          mkdir -p build/artifacts
          tag="${GITHUB_REF_NAME//\//-}"
          mapfile -t apks < <(compgen -G "$RELEASE_APK_GLOB" || true)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one multi-ABI release APK, found ${#apks[@]}"
            printf '%s\n' "${apks[@]}"
            exit 1
          fi
          asset_path="build/artifacts/fuo-evolve-${tag}-android-signed.apk"
          cp "${apks[0]}" "$asset_path"
          echo "path=$asset_path" >> "$GITHUB_OUTPUT"

      - name: Upload release APK asset
        uses: actions/upload-artifact@v7
        with:
          name: fuo-evolve-android-release
          path: ${{ steps.asset.outputs.path }}
          archive: false
          if-no-files-found: error

  build-desktop-release:
    name: Build desktop release packages
    if: github.event_name == 'push'
    needs:
      - desktop-tests
    uses: ./.github/workflows/desktop-packaging.yml

  publish-release:
    name: Publish release
    needs:
      - build-android-release
      - build-desktop-release
      - ios-tests
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download Android release asset
        uses: actions/download-artifact@v8
        with:
          name: fuo-evolve-${{ github.ref_name }}-android-signed.apk
          path: build/android-release

      - name: Download desktop release assets
        uses: actions/download-artifact@v8
        with:
          pattern: FuoEvolve-*
          path: build/desktop-release
          merge-multiple: true

      - name: Prepare and verify release assets
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME//\//-}"
          mkdir -p build/artifacts

          android="build/android-release/fuo-evolve-${tag}-android-signed.apk"
          test -f "$android"
          cp "$android" build/artifacts/

          declare -A desktop_assets=(
            ["FuoEvolve-windows-x64.exe"]="FuoEvolve-${tag}-windows-x64.exe"
            ["FuoEvolve-macos-arm64.dmg"]="FuoEvolve-${tag}-macos-arm64.dmg"
            ["FuoEvolve-macos-x64.dmg"]="FuoEvolve-${tag}-macos-x64.dmg"
            ["FuoEvolve-linux-x64.AppImage"]="FuoEvolve-${tag}-linux-x64.AppImage"
            ["FuoEvolve-linux-x64.deb"]="FuoEvolve-${tag}-linux-x64.deb"
            ["FuoEvolve-linux-x64.rpm"]="FuoEvolve-${tag}-linux-x64.rpm"
            ["FuoEvolve-linux-x64.pkg.tar.zst"]="FuoEvolve-${tag}-linux-x64.pkg.tar.zst"
          )

          desktop_source_count="$(find build/desktop-release -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [ "$desktop_source_count" -ne "${#desktop_assets[@]}" ]; then
            echo "::error::Expected ${#desktop_assets[@]} desktop artifacts, found $desktop_source_count"
            find build/desktop-release -maxdepth 1 -type f -print || true
            exit 1
          fi

          for source_name in "${!desktop_assets[@]}"; do
            source_path="build/desktop-release/$source_name"
            target_name="${desktop_assets[$source_name]}"
            if [ ! -f "$source_path" ]; then
              echo "::error::Missing desktop release asset: $source_name"
              find build/desktop-release -maxdepth 1 -type f -print || true
              exit 1
            fi
            cp "$source_path" "build/artifacts/$target_name"
          done

          expected_count=8
          actual_count="$(find build/artifacts -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [ "$actual_count" -ne "$expected_count" ]; then
            echo "::error::Expected $expected_count release artifacts before checksums, found $actual_count"
            find build/artifacts -maxdepth 1 -type f -print
            exit 1
          fi

          (
            cd build/artifacts
            sha256sum * | sort -k2 > SHA256SUMS.txt
          )
          cat build/artifacts/SHA256SUMS.txt

      - name: Collect release context
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/collect-release-context.sh "$GITHUB_REF_NAME" "$GITHUB_SHA" build/release-context.md

      - name: Set up Node.js
        uses: actions/setup-node@v7

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Generate release highlights with Copilot
        id: release_summary
        continue-on-error: true
        uses: actions/ai-inference@v3
        with:
          prompt-file: ./.github/prompts/release-summary.prompt.yml
          model: auto
          file_input: |
            release_context: ./build/release-context.md
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}

      - name: Prepare release intro
        if: always()
        env:
          SUMMARY_OUTCOME: ${{ steps.release_summary.outcome }}
          SUMMARY_FILE: ${{ steps.release_summary.outputs.response-file }}
        run: |
          mkdir -p build
          : > build/release-intro.md
          if [ "$SUMMARY_OUTCOME" = "success" ] && [ -n "$SUMMARY_FILE" ] && [ -s "$SUMMARY_FILE" ]; then
            {
              echo "## ✨ 重点改动"
              echo
              cat "$SUMMARY_FILE"
              echo
              echo
              echo "---"
              echo
            } > build/release-intro.md
          else
            echo "::warning::Copilot release summary unavailable; publishing GitHub generated notes only."
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: build/artifacts/*
          body_path: build/release-intro.md
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true

  publish-aur:
    name: Publish AUR source package
    needs:
      - publish-release
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: fuoevolve-aur-publish
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Render source-based AUR package
        run: |
          set -euo pipefail
          release_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          bash scripts/render-aur-package.sh "$GITHUB_REF_NAME" "$release_commit" build/aur

      - name: Verify AUR package payload
        run: |
          set -euo pipefail
          test -s build/aur/PKGBUILD
          test -s build/aur/.SRCINFO
          grep -Fq "pkgver = ${GITHUB_REF_NAME}" build/aur/.SRCINFO
          grep -Fq 'archive/refs/tags/${pkgver}.tar.gz' build/aur/PKGBUILD
          grep -Fq "archive/refs/tags/${GITHUB_REF_NAME}.tar.gz" build/aur/.SRCINFO
          if find build/aur -maxdepth 1 -type f ! -name PKGBUILD ! -name .SRCINFO -print -quit | grep -q .; then
            echo "::error::AUR payload contains files other than PKGBUILD and .SRCINFO"
            find build/aur -maxdepth 1 -type f -print
            exit 1
          fi

      - name: Configure AUR SSH authentication
        run: |
          set -euo pipefail
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::error::AUR_SSH_PRIVATE_KEY is not configured"
            exit 1
          fi

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" | sed 's/\r$//' > "$HOME/.ssh/aur"
          chmod 600 "$HOME/.ssh/aur"
          ssh-keyscan -H aur.archlinux.org >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<'EOF'
          Host aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/aur
            IdentitiesOnly yes
            BatchMode yes
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Publish PKGBUILD to AUR
        run: |
          set -euo pipefail
          aur_dir=build/aur-repo
          git -c init.defaultBranch=master clone ssh://aur@aur.archlinux.org/fuoevolve.git "$aur_dir"

          current_version=""
          if [ -s "$aur_dir/.SRCINFO" ]; then
            current_version="$(awk -F' = ' '$1 ~ /^[[:space:]]*pkgver$/ { print $2; exit }' "$aur_dir/.SRCINFO")"
          fi
          if [ -n "$current_version" ] && [ "$current_version" != "$GITHUB_REF_NAME" ]; then
            newest_version="$(printf '%s\n%s\n' "$current_version" "$GITHUB_REF_NAME" | sort -V | tail -n 1)"
            if [ "$newest_version" = "$current_version" ]; then
              echo "AUR already has newer version $current_version; skipping older release $GITHUB_REF_NAME."
              exit 0
            fi
          fi

          find "$aur_dir" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp build/aur/PKGBUILD "$aur_dir/PKGBUILD"
          cp build/aur/.SRCINFO "$aur_dir/.SRCINFO"

          git -C "$aur_dir" config user.name "FuoEvolve Release Bot"
          git -C "$aur_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$aur_dir" add -A

          if git -C "$aur_dir" diff --cached --quiet; then
            echo "AUR package already matches release ${GITHUB_REF_NAME}; nothing to push."
            exit 0
          fi

          git -C "$aur_dir" commit -m "Update to ${GITHUB_REF_NAME}"
          git -C "$aur_dir" push origin HEAD:master

  publish-fdroid-pages:
    name: Publish F-Droid repository to Pages
    needs: publish-release
    if: >-
      always() &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
       (github.event_name == 'push' && needs.publish-release.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: fuoevolve-github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      FUO_SIGNING_KEYSTORE_BASE64: ${{ secrets.FUO_SIGNING_KEYSTORE_BASE64 }}
      FUO_SIGNING_STORE_PASSWORD: ${{ secrets.FUO_SIGNING_STORE_PASSWORD }}
      FUO_SIGNING_KEY_ALIAS: ${{ secrets.FUO_SIGNING_KEY_ALIAS }}
      FUO_SIGNING_KEY_PASSWORD: ${{ secrets.FUO_SIGNING_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      FDROID_DOCKER_IMAGE: registry.gitlab.com/fdroid/docker-executable-fdroidserver:master

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build F-Droid repository and Pages site
        run: |
          docker pull "$FDROID_DOCKER_IMAGE"
          bash scripts/build-fdroid-pages.sh

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          if [[ ! "$tag" =~ $version_pattern ]]; then
            echo "::error::Release tag must be a 3- or 4-component numeric version: $tag"
            exit 1
          fi

          mapfile -t release_tags < <(
            (git tag --list '[0-9]*' | grep -E "$version_pattern" || true) | sort -V
          )
          if (( ${#release_tags[@]} == 0 )); then
            echo "::error::No numeric release tags were found"
            exit 1
          fi

          latest_index=$((${#release_tags[@]} - 1))
          latest_tag="${release_tags[$latest_index]}"
          if [[ "$latest_tag" != "$tag" ]]; then
            echo "::error::Release tag $tag is not the newest numeric version; newest is $latest_tag"
            exit 1
          fi

          mapfile -t same_commit_tags < <(
            (git tag --points-at "$GITHUB_SHA" --list '[0-9]*' | grep -E "$version_pattern" || true) | sort -V
          )
          if (( ${#same_commit_tags[@]} != 1 )) || [[ "${same_commit_tags[0]:-}" != "$tag" ]]; then
            echo "::error::Release commit must have exactly one numeric version tag. Found: ${same_commit_tags[*]:-none}"
            exit 1
          fi

          if (( latest_index > 0 )); then
            previous_tag="${release_tags[$((latest_index - 1))]}"
            if ! git merge-base --is-ancestor "$previous_tag" "$GITHUB_SHA"; then
              echo "::error::Release $tag is not descended from previous release $previous_tag"
              exit 1
            fi
            previous_count="$(git rev-list --count "$previous_tag")"
            current_count="$(git rev-list --count "$GITHUB_SHA")"
            if (( current_count <= previous_count )); then
              echo "::error::Release $tag would not advance Android versionCode: current=$current_count previous=$previous_count"
              exit 1
            fi
          fi

  android-tests:
    name: Android tests
    if: github.event_name == 'push'
    uses: ./.github/workflows/android-tests.yml
    secrets:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

  desktop-tests:
    name: Desktop tests
    if: github.event_name == 'push'
    uses: ./.github/workflows/desktop-tests.yml

  ios-tests:
    name: iOS tests
    if: github.event_name == 'push'
    uses: ./.github/workflows/ios-tests.yml

  build-android-release:
    name: Build signed Android release APK
    if: github.event_name == 'push'
    needs:
      - android-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FUO_SIGNING_STORE_FILE: ${{ github.workspace }}/signing/fuo-evolve.jks
      FUO_SIGNING_STORE_PASSWORD: ${{ secrets.FUO_SIGNING_STORE_PASSWORD }}
      FUO_SIGNING_KEY_ALIAS: ${{ secrets.FUO_SIGNING_KEY_ALIAS }}
      FUO_SIGNING_KEY_PASSWORD: ${{ secrets.FUO_SIGNING_KEY_PASSWORD }}
      FUO_SIGNING_KEYSTORE_BASE64: ${{ secrets.FUO_SIGNING_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare Git refs for Gradle versioning
        run: |
          if ! git show-ref --verify --quiet refs/heads/master; then
            git branch master origin/master
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          build-scan-publish: true
          build-scan-terms-of-use-url: https://gradle.com/terms-of-service
          build-scan-terms-of-use-agree: "yes"
          add-job-summary: never

      - name: Prepare signing keystore
        run: |
          for name in FUO_SIGNING_KEYSTORE_BASE64 FUO_SIGNING_STORE_PASSWORD FUO_SIGNING_KEY_ALIAS FUO_SIGNING_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required signing secret: ${name}"
              exit 1
            fi
          done
          mkdir -p "$(dirname "$FUO_SIGNING_STORE_FILE")"
          printf '%s' "$FUO_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$FUO_SIGNING_STORE_FILE"

      - name: Build signed release APK
        env:
          GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
        run: |
          if [ -n "$GRADLE_ENCRYPTION_KEY" ]; then
            echo "Using Gradle configuration cache."
            ./gradlew --configuration-cache :androidApp:assembleRelease
          else
            echo "::warning::GRADLE_ENCRYPTION_KEY is not configured; configuration cache persistence is disabled."
            ./gradlew --no-configuration-cache :androidApp:assembleRelease
          fi

      - name: Prepare release APK asset
        id: asset
        env:
          RELEASE_APK_GLOB: androidApp/build/outputs/apk/release/*.apk
        run: |
          mkdir -p build/artifacts
          tag="${GITHUB_REF_NAME//\//-}"
          mapfile -t apks < <(compgen -G "$RELEASE_APK_GLOB" || true)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one multi-ABI release APK, found ${#apks[@]}"
            printf '%s\n' "${apks[@]}"
            exit 1
          fi
          asset_path="build/artifacts/fuo-evolve-${tag}-android-signed.apk"
          cp "${apks[0]}" "$asset_path"
          echo "path=$asset_path" >> "$GITHUB_OUTPUT"

      - name: Upload release APK asset
        uses: actions/upload-artifact@v7
        with:
          name: fuo-evolve-android-release
          path: ${{ steps.asset.outputs.path }}
          archive: false
          if-no-files-found: error

  build-desktop-release:
    name: Build desktop release packages
    if: github.event_name == 'push'
    needs:
      - desktop-tests
    uses: ./.github/workflows/desktop-packaging.yml

  publish-release:
    name: Publish release
    needs:
      - build-android-release
      - build-desktop-release
      - ios-tests
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download Android release asset
        uses: actions/download-artifact@v8
        with:
          name: fuo-evolve-${{ github.ref_name }}-android-signed.apk
          path: build/android-release

      - name: Download desktop release assets
        uses: actions/download-artifact@v8
        with:
          pattern: FuoEvolve-*
          path: build/desktop-release
          merge-multiple: true

      - name: Prepare and verify release assets
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME//\//-}"
          mkdir -p build/artifacts

          android="build/android-release/fuo-evolve-${tag}-android-signed.apk"
          test -f "$android"
          cp "$android" build/artifacts/

          declare -A desktop_assets=(
            ["FuoEvolve-windows-x64.exe"]="FuoEvolve-${tag}-windows-x64.exe"
            ["FuoEvolve-macos-arm64.dmg"]="FuoEvolve-${tag}-macos-arm64.dmg"
            ["FuoEvolve-macos-x64.dmg"]="FuoEvolve-${tag}-macos-x64.dmg"
            ["FuoEvolve-linux-x64.AppImage"]="FuoEvolve-${tag}-linux-x64.AppImage"
            ["FuoEvolve-linux-x64.deb"]="FuoEvolve-${tag}-linux-x64.deb"
            ["FuoEvolve-linux-x64.rpm"]="FuoEvolve-${tag}-linux-x64.rpm"
            ["FuoEvolve-linux-x64.pkg.tar.zst"]="FuoEvolve-${tag}-linux-x64.pkg.tar.zst"
          )

          desktop_source_count="$(find build/desktop-release -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [ "$desktop_source_count" -ne "${#desktop_assets[@]}" ]; then
            echo "::error::Expected ${#desktop_assets[@]} desktop artifacts, found $desktop_source_count"
            find build/desktop-release -maxdepth 1 -type f -print || true
            exit 1
          fi

          for source_name in "${!desktop_assets[@]}"; do
            source_path="build/desktop-release/$source_name"
            target_name="${desktop_assets[$source_name]}"
            if [ ! -f "$source_path" ]; then
              echo "::error::Missing desktop release asset: $source_name"
              find build/desktop-release -maxdepth 1 -type f -print || true
              exit 1
            fi
            cp "$source_path" "build/artifacts/$target_name"
          done

          expected_count=8
          actual_count="$(find build/artifacts -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [ "$actual_count" -ne "$expected_count" ]; then
            echo "::error::Expected $expected_count release artifacts before checksums, found $actual_count"
            find build/artifacts -maxdepth 1 -type f -print
            exit 1
          fi

          (
            cd build/artifacts
            sha256sum * | sort -k2 > SHA256SUMS.txt
          )
          cat build/artifacts/SHA256SUMS.txt

      - name: Collect release context
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/collect-release-context.sh "$GITHUB_REF_NAME" "$GITHUB_SHA" build/release-context.md

      - name: Set up Node.js
        uses: actions/setup-node@v7

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Generate release highlights with Copilot
        id: release_summary
        continue-on-error: true
        uses: actions/ai-inference@v3
        with:
          prompt-file: ./.github/prompts/release-summary.prompt.yml
          model: auto
          file_input: |
            release_context: ./build/release-context.md
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}

      - name: Prepare release intro
        if: always()
        env:
          SUMMARY_OUTCOME: ${{ steps.release_summary.outcome }}
          SUMMARY_FILE: ${{ steps.release_summary.outputs.response-file }}
        run: |
          mkdir -p build
          : > build/release-intro.md
          if [ "$SUMMARY_OUTCOME" = "success" ] && [ -n "$SUMMARY_FILE" ] && [ -s "$SUMMARY_FILE" ]; then
            {
              echo "## ✨ 重点改动"
              echo
              cat "$SUMMARY_FILE"
              echo
              echo
              echo "---"
              echo
            } > build/release-intro.md
          else
            echo "::warning::Copilot release summary unavailable; publishing GitHub generated notes only."
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: build/artifacts/*
          body_path: build/release-intro.md
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true

  publish-aur:
    name: Publish AUR source package
    needs:
      - publish-release
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: fuoevolve-aur-publish
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Render source-based AUR package
        run: |
          set -euo pipefail
          release_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          bash scripts/render-aur-package.sh "$GITHUB_REF_NAME" "$release_commit" build/aur

      - name: Verify AUR package payload
        run: |
          set -euo pipefail
          test -s build/aur/PKGBUILD
          test -s build/aur/.SRCINFO
          grep -Fq "pkgver = ${GITHUB_REF_NAME}" build/aur/.SRCINFO
          grep -Fq 'archive/refs/tags/${pkgver}.tar.gz' build/aur/PKGBUILD
          grep -Fq "archive/refs/tags/${GITHUB_REF_NAME}.tar.gz" build/aur/.SRCINFO
          if find build/aur -maxdepth 1 -type f ! -name PKGBUILD ! -name .SRCINFO -print -quit | grep -q .; then
            echo "::error::AUR payload contains files other than PKGBUILD and .SRCINFO"
            find build/aur -maxdepth 1 -type f -print
            exit 1
          fi

      - name: Configure AUR SSH authentication
        run: |
          set -euo pipefail
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::error::AUR_SSH_PRIVATE_KEY is not configured"
            exit 1
          fi

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" | sed 's/\r$//' > "$HOME/.ssh/aur"
          chmod 600 "$HOME/.ssh/aur"
          ssh-keyscan -H aur.archlinux.org >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<'EOF'
          Host aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/aur
            IdentitiesOnly yes
            BatchMode yes
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Publish PKGBUILD to AUR
        run: |
          set -euo pipefail
          aur_dir=build/aur-repo
          git -c init.defaultBranch=master clone ssh://aur@aur.archlinux.org/fuoevolve.git "$aur_dir"

          current_version=""
          if [ -s "$aur_dir/.SRCINFO" ]; then
            current_version="$(awk -F' = ' '$1 ~ /^[[:space:]]*pkgver$/ { print $2; exit }' "$aur_dir/.SRCINFO")"
          fi
          if [ -n "$current_version" ] && [ "$current_version" != "$GITHUB_REF_NAME" ]; then
            newest_version="$(printf '%s\n%s\n' "$current_version" "$GITHUB_REF_NAME" | sort -V | tail -n 1)"
            if [ "$newest_version" = "$current_version" ]; then
              echo "AUR already has newer version $current_version; skipping older release $GITHUB_REF_NAME."
              exit 0
            fi
          fi

          find "$aur_dir" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp build/aur/PKGBUILD "$aur_dir/PKGBUILD"
          cp build/aur/.SRCINFO "$aur_dir/.SRCINFO"

          git -C "$aur_dir" config user.name "FuoEvolve Release Bot"
          git -C "$aur_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$aur_dir" add -A

          if git -C "$aur_dir" diff --cached --quiet; then
            echo "AUR package already matches release ${GITHUB_REF_NAME}; nothing to push."
            exit 0
          fi

          git -C "$aur_dir" commit -m "Update to ${GITHUB_REF_NAME}"
          git -C "$aur_dir" push origin HEAD:master

  publish-fdroid-pages:
    name: Publish F-Droid repository to Pages
    needs: publish-release
    if: >-
      always() &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
       (github.event_name == 'push' && needs.publish-release.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: fuoevolve-github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      FUO_SIGNING_KEYSTORE_BASE64: ${{ secrets.FUO_SIGNING_KEYSTORE_BASE64 }}
      FUO_SIGNING_STORE_PASSWORD: ${{ secrets.FUO_SIGNING_STORE_PASSWORD }}
      FUO_SIGNING_KEY_ALIAS: ${{ secrets.FUO_SIGNING_KEY_ALIAS }}
      FUO_SIGNING_KEY_PASSWORD: ${{ secrets.FUO_SIGNING_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      FDROID_DOCKER_IMAGE: registry.gitlab.com/fdroid/docker-executable-fdroidserver:master

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build F-Droid repository and Pages site
        run: |
          docker pull "$FDROID_DOCKER_IMAGE"
          bash scripts/build-fdroid-pages.sh

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}