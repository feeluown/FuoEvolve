name: Desktop Tests

"on":
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    name: Linux desktop, tray and WebView login
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare Git refs for Gradle versioning
        run: |
          if ! git show-ref --verify --quiet refs/heads/master; then
            git branch master origin/master
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: never

      - name: Set up Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      - name: Install Linux WebKitGTK build dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev

      - name: Compile Rust StatusNotifier tray bridge
        run: cargo build --manifest-path desktopApp/native/linux-tray/Cargo.toml --release

      - name: Test Rust WebView login helper
        run: cargo test --manifest-path desktopApp/native/web-login/Cargo.toml --release

      - name: Test Linux desktop foundation
        run: ./gradlew --no-configuration-cache --warning-mode all ciDesktopTest

  windows:
    name: Windows desktop, SMTC and WebView login
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare Git refs for Gradle versioning
        shell: pwsh
        run: |
          git show-ref --verify --quiet refs/heads/master
          if ($LASTEXITCODE -ne 0) {
            git branch master origin/master
          }

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: never

      - name: Set up Rust stable
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      - name: Compile Rust SMTC bridge
        shell: pwsh
        run: cargo build --manifest-path desktopApp/native/windows-smtc/Cargo.toml --release

      - name: Test Rust WebView login helper
        shell: pwsh
        run: cargo test --manifest-path desktopApp/native/web-login/Cargo.toml --release

      - name: Test Windows desktop foundation
        shell: pwsh
        run: ./gradlew.bat --no-configuration-cache --warning-mode all ciDesktopTest

  macos:
    name: macOS desktop, Now Playing and WebView login
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare Git refs for Gradle versioning
        run: |
          if ! git show-ref --verify --quiet refs/heads/master; then
            git branch master origin/master
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: never

      - name: Set up Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
          cargo --version
          swift --version
          xcodebuild -version

      - name: Compile Rust Now Playing bridge
        run: cargo build --manifest-path desktopApp/native/macos-now-playing/Cargo.toml --release

      - name: Test Rust WebView login helper
        run: cargo test --manifest-path desktopApp/native/web-login/Cargo.toml --release

      - name: Test macOS desktop foundation
        run: ./gradlew --no-configuration-cache --warning-mode all ciDesktopTest
