name: Desktop Tests

"on":
  push:
    branches:
      - master
    paths:
      - "desktopApp/**"
      - "shared/**"
      - "core/**"
      - "feature/**"
      - "playback/**"
      - "provider/**"
      - "persistence/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - ".github/workflows/desktop-tests.yml"
  pull_request:
    paths:
      - "desktopApp/**"
      - "shared/**"
      - "core/**"
      - "feature/**"
      - "playback/**"
      - "provider/**"
      - "persistence/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - ".github/workflows/desktop-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Compile Linux desktop and StatusNotifier tray bridge
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare Git refs for Gradle versioning
        run: |
          if ! git show-ref --verify --quiet refs/heads/master; then
            git branch master origin/master
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      - name: Compile Rust StatusNotifier tray bridge
        run: cargo build --manifest-path desktopApp/native/linux-tray/Cargo.toml --release

      - name: Compile Linux desktop foundation
        run: >-
          ./gradlew
          --no-configuration-cache
          --warning-mode all
          :desktopApp:compileKotlin
          :desktopApp:test
          :shared:desktopTest

  windows-smtc:
    name: Compile Windows desktop and Rust SMTC bridge
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare Git refs for Gradle versioning
        shell: pwsh
        run: |
          git show-ref --verify --quiet refs/heads/master
          if ($LASTEXITCODE -ne 0) {
            git branch master origin/master
          }

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Rust stable
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      - name: Compile Rust SMTC bridge
        shell: pwsh
        run: cargo build --manifest-path desktopApp/native/windows-smtc/Cargo.toml --release

      - name: Compile Windows desktop foundation
        shell: pwsh
        run: >-
          ./gradlew.bat
          --no-configuration-cache
          --warning-mode all
          :desktopApp:compileKotlin
          :desktopApp:test
          :shared:desktopTest

  macos-now-playing:
    name: Compile macOS desktop and Rust Now Playing bridge
    runs-on: macos-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare Git refs for Gradle versioning
        run: |
          if ! git show-ref --verify --quiet refs/heads/master; then
            git branch master origin/master
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
          cargo --version
          swift --version
          xcodebuild -version

      - name: Compile Rust Now Playing bridge
        run: cargo build --manifest-path desktopApp/native/macos-now-playing/Cargo.toml --release

      - name: Compile macOS desktop foundation
        run: >-
          ./gradlew
          --no-configuration-cache
          --warning-mode all
          :desktopApp:compileKotlin
          :desktopApp:test
          :shared:desktopTest
