name: Desktop Tests

"on":
  workflow_call:
    inputs:
      platform:
        description: Desktop platform to validate
        required: false
        default: all
        type: string

permissions:
  contents: read

jobs:
  linux:
    if: inputs.platform == 'all' || inputs.platform == 'linux'
    name: Linux tray and WebView login
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      - name: Install Linux WebKitGTK build dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev

      - name: Compile Rust StatusNotifier tray bridge
        run: cargo build --manifest-path desktopApp/native/linux-tray/Cargo.toml --release

      - name: Test Rust WebView login helper
        run: cargo test --manifest-path desktopApp/native/web-login/Cargo.toml --release

  windows:
    if: inputs.platform == 'all' || inputs.platform == 'windows'
    name: Windows SMTC and WebView login
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Rust stable
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      - name: Compile Rust SMTC bridge
        shell: pwsh
        run: cargo build --manifest-path desktopApp/native/windows-smtc/Cargo.toml --release

      - name: Test Rust WebView login helper
        shell: pwsh
        run: cargo test --manifest-path desktopApp/native/web-login/Cargo.toml --release

  macos:
    if: inputs.platform == 'all' || inputs.platform == 'macos'
    name: macOS Now Playing and WebView login
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
          cargo --version
          swift --version
          xcodebuild -version

      - name: Compile Rust Now Playing bridge
        run: cargo build --manifest-path desktopApp/native/macos-now-playing/Cargo.toml --release

      - name: Test Rust WebView login helper
        run: cargo test --manifest-path desktopApp/native/web-login/Cargo.toml --release
