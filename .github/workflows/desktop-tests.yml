name: Nucleus Desktop Tests

"on":
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    name: Linux Nucleus runtime
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare Git refs for Gradle versioning
        run: |
          if ! git show-ref --verify --quiet refs/heads/master; then
            git branch master origin/master
          fi

      - name: Set up Nucleus toolchain
        uses: NucleusFramework/Nucleus/.github/actions/setup-nucleus@v2.5.15
        with:
          java-version: "17"
          packaging-tools: "false"
          setup-node: "false"

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libmpv-dev \
            libsecret-1-dev \
            libwebkit2gtk-4.1-dev

      - name: Test shared desktop and Nucleus runtime
        run: |
          ./gradlew \
            --no-configuration-cache \
            --warning-mode all \
            -PenableNucleusDesktopPoc=true \
            ciDesktopTest \
            :desktopNucleusPoc:test \
            :desktopNucleusPoc:compileKotlin \
            :desktopNucleusPoc:prepareNucleusAppResources

  windows:
    name: Windows Nucleus runtime
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      FUOEVOLVE_NUCLEUS_LIBMPV_DEV_DIR: ${{ github.workspace }}\build\nucleus-native\windows\mpv
      FUOEVOLVE_NUCLEUS_LIBMPV_RUNTIME_DIR: ${{ github.workspace }}\build\nucleus-native\windows\mpv

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare Git refs for Gradle versioning
        shell: pwsh
        run: |
          git show-ref --verify --quiet refs/heads/master
          if ($LASTEXITCODE -ne 0) {
            git branch master origin/master
          }

      - name: Set up Nucleus toolchain
        uses: NucleusFramework/Nucleus/.github/actions/setup-nucleus@v2.5.15
        with:
          java-version: "17"
          packaging-tools: "false"
          setup-node: "false"

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare pinned Windows libmpv development bundle
        shell: pwsh
        run: >-
          ./desktopNucleusPoc/packaging/windows/prepare-libmpv-dev.ps1
          -OutputDir "$env:FUOEVOLVE_NUCLEUS_LIBMPV_DEV_DIR"

      - name: Verify Windows native compiler
        shell: pwsh
        run: clang --version

      - name: Test shared desktop and Nucleus runtime
        shell: pwsh
        run: |
          .\gradlew.bat `
            --no-configuration-cache `
            --warning-mode all `
            -PenableNucleusDesktopPoc=true `
            ciDesktopTest `
            :desktopNucleusPoc:test `
            :desktopNucleusPoc:compileKotlin `
            :desktopNucleusPoc:prepareNucleusAppResources
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  macos:
    name: macOS Nucleus runtime
    runs-on: macos-15
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare Git refs for Gradle versioning
        run: |
          if ! git show-ref --verify --quiet refs/heads/master; then
            git branch master origin/master
          fi

      - name: Set up Nucleus toolchain
        uses: NucleusFramework/Nucleus/.github/actions/setup-nucleus@v2.5.15
        with:
          java-version: "17"
          packaging-tools: "false"
          setup-node: "false"

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare macOS libmpv development runtime
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew list mpv >/dev/null 2>&1 || brew install mpv
          MPV_PREFIX="$(brew --prefix mpv)"
          echo "FUOEVOLVE_NUCLEUS_LIBMPV_DEV_DIR=$MPV_PREFIX" >> "$GITHUB_ENV"
          echo "FUOEVOLVE_NUCLEUS_LIBMPV_RUNTIME_DIR=$MPV_PREFIX/lib" >> "$GITHUB_ENV"

      - name: Test shared desktop and Nucleus runtime
        run: |
          ./gradlew \
            --no-configuration-cache \
            --warning-mode all \
            -PenableNucleusDesktopPoc=true \
            ciDesktopTest \
            :desktopNucleusPoc:test \
            :desktopNucleusPoc:compileKotlin \
            :desktopNucleusPoc:prepareNucleusAppResources
