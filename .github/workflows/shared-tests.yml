name: Shared Tests

"on":
  workflow_call:
    secrets:
      GRADLE_ENCRYPTION_KEY:
        required: false

jobs:
  test:
    name: Run shared architecture and JVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare Git refs for Gradle versioning
        run: |
          if ! git show-ref --verify --quiet refs/heads/master; then
            git branch master origin/master
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          add-job-summary: never

      - name: Run architecture and feature boundary checks
        run: >-
          ./gradlew
          --no-configuration-cache
          --warning-mode all
          checkArchitectureBoundaries
          :feature:download:checkOfflineFeatureBoundaries
          :feature:providerauth:checkProviderFeatureBoundaries
          :feature:providerdetail:checkProviderDetailFeatureBoundaries
          :feature:settings:checkSettingsFeatureBoundaries
          :feature:onboarding:checkOnboardingFeatureBoundaries
          :feature:home:checkHomeFeatureBoundaries
          :feature:playback:checkPlaybackFeatureBoundaries
          :shared:checkP4ContractBoundaries

      - name: Run shared JVM tests and generate project coverage
        run: >-
          ./gradlew
          --configuration-cache
          --warning-mode all
          :coverage:koverXmlReportProjectJvm
          :coverage:koverHtmlReportProjectJvm

      - name: Find latest master coverage baseline
        id: baseline
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=""
          while read -r candidate; do
            artifact_count="$(
              gh api \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/repos/${GITHUB_REPOSITORY}/actions/runs/${candidate}/artifacts?per_page=100" \
                --jq '[.artifacts[] | select(.name == "kotlin-jvm-coverage" and .expired == false)] | length'
            )"
            if [ "$artifact_count" -gt 0 ]; then
              run_id="$candidate"
              break
            fi
          done < <(
            gh api \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/master-canary.yml/runs?branch=master&event=push&status=success&per_page=20" \
              --jq '.workflow_runs[].id'
          )
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download master coverage baseline
        if: steps.baseline.outputs.run_id != ''
        uses: actions/download-artifact@v8
        with:
          name: kotlin-jvm-coverage
          path: build/coverage-baseline
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.baseline.outputs.run_id }}

      - name: Write Kotlin JVM coverage summary
        run: |
          report=coverage/build/reports/kover/report.xml
          metrics=coverage/build/reports/kover/metrics.json
          baseline=build/coverage-baseline/report.xml
          if [ -f "$baseline" ]; then
            python3 scripts/summarize-kover.py \
              "$report" \
              "$baseline" \
              --json-output "$metrics" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            python3 scripts/summarize-kover.py \
              "$report" \
              --json-output "$metrics" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Kotlin JVM coverage report
        uses: actions/upload-artifact@v7
        with:
          name: kotlin-jvm-coverage
          path: |
            coverage/build/reports/kover/report.xml
            coverage/build/reports/kover/html
            coverage/build/reports/kover/metrics.json
          retention-days: 14
          if-no-files-found: error
