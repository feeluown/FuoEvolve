name: Nucleus Desktop PoC

"on":
  pull_request:
    paths:
      - "desktopNucleusPoc/**"
      - "desktopRuntime/**"
      - "desktopApp/native/web-login/**"
      - "shared/src/desktopMain/kotlin/org/feeluown/mobile/DesktopWebViewHelper.kt"
      - "settings.gradle.kts"
      - ".github/workflows/nucleus-desktop-poc.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nucleus-desktop-poc-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  linux-tao:
    name: Linux Tao JVM and GraalVM smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: never

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tao, WebView, libmpv and Native Image runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            patchelf \
            xvfb \
            openbox \
            mesa-utils \
            libegl1 \
            libgl1-mesa-dri \
            libgtk-3-0 \
            libxkbcommon-x11-0 \
            libsecret-1-dev \
            libwebkit2gtk-4.1-dev \
            libmpv-dev

      - name: Test shared desktop runtime
        run: >-
          ./gradlew
          --no-configuration-cache
          --warning-mode all
          :desktopRuntime:test

      - name: Compile Nucleus runtime and native helpers
        run: >-
          ./gradlew
          --no-configuration-cache
          --warning-mode all
          -PenableNucleusDesktopPoc=true
          :desktopNucleusPoc:compileKotlin
          :desktopNucleusPoc:prepareNucleusAppResources

      - name: Start Tao JVM window and compose existing UI
        env:
          FUOEVOLVE_NUCLEUS_POC_SMOKE: "1"
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1600x1200x24 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            xdpyinfo -display :99 >/dev/null 2>&1 && break
            sleep 0.2
          done
          openbox &
          sleep 1
          timeout 90s ./gradlew \
            --no-configuration-cache \
            --warning-mode all \
            -PenableNucleusDesktopPoc=true \
            :desktopNucleusPoc:run

      - name: Build packaged GraalVM Native Image
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          timeout 2400s ./gradlew \
            --no-daemon \
            --no-configuration-cache \
            --warning-mode all \
            --stacktrace \
            -PenableNucleusDesktopPoc=true \
            -PnativeMarch=compatibility \
            :desktopNucleusPoc:packageGraalvmNative

      - name: Verify packaged native runtime
        run: |
          APPDIR=$(find desktopNucleusPoc/build/compose/binaries -type d -name graalvm-app | head -1)
          echo "app dir: $APPDIR"
          test -n "$APPDIR" && test -d "$APPDIR"

          BIN=$(find "$APPDIR" -type f -name 'fuoevolve-nucleus-poc' -perm -111 | head -1)
          HELPER=$(find "$APPDIR" -type f -name 'fuoevolve-web-login' -perm -111 | head -1)
          MPV_JNI=$(find "$APPDIR" -type f -name 'libfuoevolve_mpv_jni.so' | head -1)
          echo "native binary: $BIN"
          echo "web login helper: $HELPER"
          echo "libmpv JNI bridge: $MPV_JNI"
          test -n "$BIN" && test -x "$BIN"
          test -n "$HELPER" && test -x "$HELPER"
          test -n "$MPV_JNI" && test -f "$MPV_JNI"
          file "$BIN"
          file "$HELPER"
          file "$MPV_JNI"
          ldd "$MPV_JNI"

      - name: Start packaged native binary and compose existing UI
        env:
          FUOEVOLVE_NUCLEUS_POC_SMOKE: "1"
        run: |
          APPDIR=$(find desktopNucleusPoc/build/compose/binaries -type d -name graalvm-app | head -1)
          BIN=$(find "$APPDIR" -type f -name 'fuoevolve-nucleus-poc' -perm -111 | head -1)

          export DISPLAY=:100
          Xvfb :100 -screen 0 1600x1200x24 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            xdpyinfo -display :100 >/dev/null 2>&1 && break
            sleep 0.2
          done
          openbox &
          sleep 1
          timeout 90s "$BIN"

      - name: Generate native playback smoke audio
        run: |
          python3 - <<'PY'
          import math
          import struct
          import wave
          from pathlib import Path

          path = Path("desktopNucleusPoc/build/native-playback-smoke.wav")
          path.parent.mkdir(parents=True, exist_ok=True)
          rate = 44100
          seconds = 5
          with wave.open(str(path), "wb") as wav:
              wav.setnchannels(1)
              wav.setsampwidth(2)
              wav.setframerate(rate)
              frames = bytearray()
              for i in range(rate * seconds):
                  value = int(9000 * math.sin(2 * math.pi * 440 * i / rate))
                  frames.extend(struct.pack("<h", value))
              wav.writeframes(frames)
          print(path.resolve())
          PY

      - name: Play audio through packaged Native Image and JNI libmpv
        env:
          FUOEVOLVE_LIBMPV_AO: "null"
        run: |
          APPDIR=$(find desktopNucleusPoc/build/compose/binaries -type d -name graalvm-app | head -1)
          BIN=$(find "$APPDIR" -type f -name 'fuoevolve-nucleus-poc' -perm -111 | head -1)
          AUDIO="$PWD/desktopNucleusPoc/build/native-playback-smoke.wav"

          export DISPLAY=:101
          export FUOEVOLVE_NUCLEUS_PLAYBACK_SMOKE="$AUDIO"
          Xvfb :101 -screen 0 1600x1200x24 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            xdpyinfo -display :101 >/dev/null 2>&1 && break
            sleep 0.2
          done
          openbox &
          sleep 1
          timeout 90s "$BIN"

      - name: Upload packaged native PoC
        uses: actions/upload-artifact@v4
        with:
          name: fuoevolve-nucleus-linux-poc
          path: desktopNucleusPoc/build/compose/binaries/**/graalvm-app/**
          if-no-files-found: error
          retention-days: 7
