name: Nucleus Desktop PoC

"on":
  pull_request:
    paths:
      - "desktopNucleusPoc/**"
      - "settings.gradle.kts"
      - ".github/workflows/nucleus-desktop-poc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-tao:
    name: Linux Tao JVM and GraalVM smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: never

      - name: Install Tao and Native Image runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            patchelf \
            xvfb \
            openbox \
            mesa-utils \
            libegl1 \
            libgl1-mesa-dri \
            libgtk-3-0 \
            libxkbcommon-x11-0

      - name: Compile isolated Nucleus module
        run: >-
          ./gradlew
          --no-configuration-cache
          --warning-mode all
          -PenableNucleusDesktopPoc=true
          :desktopNucleusPoc:compileKotlin

      - name: Start Tao JVM window and compose existing UI
        env:
          FUOEVOLVE_NUCLEUS_POC_SMOKE: "1"
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1600x1200x24 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            xdpyinfo -display :99 >/dev/null 2>&1 && break
            sleep 0.2
          done
          openbox &
          sleep 1
          timeout 90s ./gradlew \
            --no-configuration-cache \
            --warning-mode all \
            -PenableNucleusDesktopPoc=true \
            :desktopNucleusPoc:run

      - name: Build and start GraalVM Native Image
        env:
          FUOEVOLVE_NUCLEUS_POC_SMOKE: "1"
        run: |
          export DISPLAY=:100
          Xvfb :100 -screen 0 1600x1200x24 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            xdpyinfo -display :100 >/dev/null 2>&1 && break
            sleep 0.2
          done
          openbox &
          sleep 1
          timeout 1200s ./gradlew \
            --no-configuration-cache \
            --warning-mode all \
            -PenableNucleusDesktopPoc=true \
            :desktopNucleusPoc:runGraalvmNative
