name: Agent P0 Pagination Patch

"on":
  push:
    branches:
      - agent/netease-p0-content

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: agent/netease-p0-content
          fetch-depth: 0

      - name: Apply scoped pagination patch
        run: |
          python - <<'PY'
          from pathlib import Path

          controller_path = Path('shared/src/commonMain/kotlin/org/feeluown/mobile/FuoPlayerController.kt')
          controller = controller_path.read_text()

          old_prefetch = '''    fun prefetchSelectedFeatureIfNeeded(visibleIndex: Int) {
              if (selectedFeatureTracks.size - visibleIndex <= LIST_PREFETCH_REMAINING) {
                  loadMoreSelectedFeatureTracks()
              }
          }
          '''
          new_prefetch = '''    fun prefetchSelectedFeatureIfNeeded(visibleIndex: Int) {
              val contentCount = selectedFeatureContent?.contentCount() ?: selectedFeatureTracks.size
              if (contentCount - visibleIndex <= LIST_PREFETCH_REMAINING) {
                  loadMoreSelectedFeatureTracks()
              }
          }

          fun loadMoreSelectedFeature() {
              loadMoreSelectedFeatureTracks()
          }
          '''
          if old_prefetch not in controller:
              raise SystemExit('prefetchSelectedFeatureIfNeeded block not found')
          controller = controller.replace(old_prefetch, new_prefetch, 1)

          old_append = '''    private suspend fun appendSelectedFeatureTracksPage(): Boolean {
              val feature = selectedFeature ?: return false
              if (feature.isDynamicQueueFeature() || !selectedFeatureTracksHasMore) return false
              val offset = selectedFeatureTracksNextOffset
              return runCatching {
                  withTimeout(30_000) {
                      providerRepository.loadFeaturePage(feature, offset)
                  }
              }.fold(
                  onSuccess = { section ->
                      if (selectedFeature != feature) return false
                      val seenIds = selectedFeatureTracks.mapTo(mutableSetOf()) { it.id }
                      val newTracks = section.tracks.filter { seenIds.add(it.id) }
                      if (newTracks.isNotEmpty()) {
                          selectedFeatureTracks = selectedFeatureTracks + newTracks
                          val updatedSection = section.copy(
                              tracks = selectedFeatureTracks,
                              nextOffset = section.nextOffset,
                              hasMore = section.hasMore,
                          )
                          selectedFeatureContent = updatedSection
                          updateHomeFeatureSection(updatedSection)
                      }
                      selectedFeatureTracksNextOffset = section.nextOffset
                      selectedFeatureTracksHasMore = section.hasMore
                      section.nextOffset != offset || newTracks.isNotEmpty()
                  },
                  onFailure = {
                      selectedFeatureError = it.message ?: it::class.simpleName.orEmpty()
                      false
                  },
              )
          }
          '''
          new_append = '''    private suspend fun appendSelectedFeatureTracksPage(): Boolean {
              val feature = selectedFeature ?: return false
              if (feature.isDynamicQueueFeature() || !selectedFeatureTracksHasMore) return false
              val offset = selectedFeatureTracksNextOffset
              return runCatching {
                  withTimeout(30_000) {
                      providerRepository.loadFeaturePage(feature, offset)
                  }
              }.fold(
                  onSuccess = { section ->
                      if (selectedFeature != feature) return false
                      val current = selectedFeatureContent ?: ProviderContentSection(feature)

                      val seenTrackIds = current.tracks.mapTo(mutableSetOf()) { it.id }
                      val newTracks = section.tracks.filter { seenTrackIds.add(it.id) }
                      val seenPlaylistIds = current.playlists.mapTo(mutableSetOf()) { it.id }
                      val newPlaylists = section.playlists.filter { seenPlaylistIds.add(it.id) }
                      val seenMediaItemIds = current.mediaItems.mapTo(mutableSetOf()) { it.id }
                      val newMediaItems = section.mediaItems.filter { seenMediaItemIds.add(it.id) }
                      val seenVideoIds = current.videos.mapTo(mutableSetOf()) { it.id }
                      val newVideos = section.videos.filter { seenVideoIds.add(it.id) }

                      val updatedSection = section.copy(
                          tracks = current.tracks + newTracks,
                          playlists = current.playlists + newPlaylists,
                          mediaItems = current.mediaItems + newMediaItems,
                          videos = current.videos + newVideos,
                          nextOffset = section.nextOffset,
                          hasMore = section.hasMore,
                      )
                      selectedFeatureTracks = updatedSection.tracks
                      selectedFeatureContent = updatedSection
                      updateHomeFeatureSection(updatedSection)
                      selectedFeatureTracksNextOffset = section.nextOffset
                      selectedFeatureTracksHasMore = section.hasMore

                      val contentChanged = newTracks.isNotEmpty() ||
                          newPlaylists.isNotEmpty() ||
                          newMediaItems.isNotEmpty() ||
                          newVideos.isNotEmpty()
                      section.nextOffset != offset || contentChanged
                  },
                  onFailure = {
                      selectedFeatureError = it.message ?: it::class.simpleName.orEmpty()
                      false
                  },
              )
          }
          '''
          if old_append not in controller:
              raise SystemExit('appendSelectedFeatureTracksPage block not found')
          controller = controller.replace(old_append, new_append, 1)
          controller_path.write_text(controller)

          screen_path = Path('shared/src/commonMain/kotlin/org/feeluown/mobile/ProviderDetailScreens.kt')
          screen = screen_path.read_text()
          old_content = '''        content?.playlists?.isNotEmpty() == true -> LazyColumn(modifier = modifier) {
              item {
                  ProviderPlaylistGrid(
                      playlists = content.playlists,
                      onClick = { controller.openPlaylist(it, content.feature.category) },
                  )
              }
          }
          content?.mediaItems?.isNotEmpty() == true -> LazyColumn(modifier = modifier) {
              item {
                  ProviderMediaItemGrid(
                      items = content.mediaItems,
                      onClick = controller::openMediaItem,
                  )
              }
          }
          content?.videos?.isNotEmpty() == true -> LazyColumn(modifier = modifier) {
              item {
                  ProviderVideoList(videos = content.videos, onClick = controller::openVideo)
              }
          }
          '''
          new_content = '''        content?.playlists?.isNotEmpty() == true -> LazyColumn(modifier = modifier) {
              item {
                  ProviderPlaylistGrid(
                      playlists = content.playlists,
                      onClick = { controller.openPlaylist(it, content.feature.category) },
                  )
              }
              if (content.hasMore) {
                  item {
                      Box(modifier = Modifier.fillMaxWidth(), contentAlignment = Alignment.Center) {
                          TextButton(onClick = controller::loadMoreSelectedFeature) { Text("加载更多") }
                      }
                  }
              }
          }
          content?.mediaItems?.isNotEmpty() == true -> LazyColumn(modifier = modifier) {
              item {
                  ProviderMediaItemGrid(
                      items = content.mediaItems,
                      onClick = controller::openMediaItem,
                  )
              }
              if (content.hasMore) {
                  item {
                      Box(modifier = Modifier.fillMaxWidth(), contentAlignment = Alignment.Center) {
                          TextButton(onClick = controller::loadMoreSelectedFeature) { Text("加载更多") }
                      }
                  }
              }
          }
          content?.videos?.isNotEmpty() == true -> LazyColumn(modifier = modifier) {
              item {
                  ProviderVideoList(videos = content.videos, onClick = controller::openVideo)
              }
              if (content.hasMore) {
                  item {
                      Box(modifier = Modifier.fillMaxWidth(), contentAlignment = Alignment.Center) {
                          TextButton(onClick = controller::loadMoreSelectedFeature) { Text("加载更多") }
                      }
                  }
              }
          }
          '''
          if old_content not in screen:
              raise SystemExit('SelectedFeatureContent non-track block not found')
          screen = screen.replace(old_content, new_content, 1)
          screen_path.write_text(screen)
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/src/commonMain/kotlin/org/feeluown/mobile/FuoPlayerController.kt \
                  shared/src/commonMain/kotlin/org/feeluown/mobile/ProviderDetailScreens.kt
          if git diff --cached --quiet; then
            echo "No patch changes"
            exit 0
          fi
          git commit -m "support pagination for provider feature content"
          git push origin HEAD:agent/netease-p0-content
