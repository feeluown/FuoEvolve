name: iOS Debug App

"on":
  push:
    branches:
      - master
    paths:
      - "iosApp/**"
      - "shared/**"
      - "core/**"
      - "feature/**"
      - "playback/**"
      - "provider/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/ios-debug-app.yml"
  pull_request:
    branches:
      - master
    paths:
      - "iosApp/**"
      - "shared/**"
      - "core/**"
      - "feature/**"
      - "playback/**"
      - "provider/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/ios-debug-app.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Run shared Android and iOS tests
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ runner.arch }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Run feature, playback runtime, shared tests and architecture checks
        run: ./gradlew checkArchitectureBoundaries :feature:recognition:allTests :feature:search:allTests :feature:localplaylist:allTests :feature:localmusic:allTests :feature:download:allTests :feature:providercatalog:allTests :feature:providerauth:allTests :feature:providerdetail:allTests :playback:runtime:allTests :shared:allTests

  build-debug-simulator:
    name: Build debug iOS simulator app
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: https://gradle.com/terms-of-service
          build-scan-terms-of-use-agree: "yes"

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ runner.arch }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Resolve Swift package dependencies
        run: |
          defaults write com.apple.dt.Xcode IDEPackageSupportUseBuiltinSCM YES
          xcodebuild \
            -resolvePackageDependencies \
            -project iosApp/FuoEvolve.xcodeproj \
            -scheme FuoEvolve \
            -derivedDataPath build/ios-ci \
            -clonedSourcePackagesDirPath build/ios-ci/SourcePackages

      - name: Build debug simulator app
        run: |
          xcodebuild \
            -project iosApp/FuoEvolve.xcodeproj \
            -scheme FuoEvolve \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/ios-ci \
            -clonedSourcePackagesDirPath build/ios-ci/SourcePackages \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package debug app bundle
        run: |
          mkdir -p build/artifacts
          tar -cf build/artifacts/FuoEvolve-debug-ios-simulator.tar \
            -C build/ios-ci/Build/Products/Debug-iphonesimulator \
            FuoEvolve.app

      - name: Upload debug app
        uses: actions/upload-artifact@v7
        with:
          name: FuoEvolve-debug-ios-simulator
          path: build/artifacts/FuoEvolve-debug-ios-simulator.tar
          archive: false
          if-no-files-found: error
