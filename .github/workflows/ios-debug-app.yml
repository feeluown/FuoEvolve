name: iOS Debug App

"on":
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-app:
    name: Build debug iOS app
    runs-on: macos-26
    environment: ios-debug-app
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: https://gradle.com/terms-of-service
          build-scan-terms-of-use-agree: "yes"

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ runner.arch }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Resolve Swift package dependencies
        run: |
          defaults write com.apple.dt.Xcode IDEPackageSupportUseBuiltinSCM YES
          xcodebuild \
            -resolvePackageDependencies \
            -project iosApp/FuoEvolve.xcodeproj \
            -scheme FuoEvolve \
            -derivedDataPath build/ios-ci \
            -clonedSourcePackagesDirPath build/ios-ci/SourcePackages

      - name: Build debug simulator app
        run: |
          xcodebuild \
            -project iosApp/FuoEvolve.xcodeproj \
            -scheme FuoEvolve \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/ios-ci \
            -clonedSourcePackagesDirPath build/ios-ci/SourcePackages \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Build debug device app
        run: |
          xcodebuild \
            -project iosApp/FuoEvolve.xcodeproj \
            -scheme FuoEvolve \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build/ios-ci \
            -clonedSourcePackagesDirPath build/ios-ci/SourcePackages \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package debug app bundle
        run: |
          mkdir -p build/artifacts
          tar -cf build/artifacts/FuoEvolve-debug-ios-simulator.tar \
            -C build/ios-ci/Build/Products/Debug-iphonesimulator \
            FuoEvolve.app

      - name: Package debug IPA
        run: |
          mkdir -p build/ipa/Payload
          ditto \
            build/ios-ci/Build/Products/Debug-iphoneos/FuoEvolve.app \
            build/ipa/Payload/FuoEvolve.app
          ditto -c -k --sequesterRsrc --keepParent \
            build/ipa/Payload \
            build/artifacts/FuoEvolve-debug-ios.ipa

      - name: Upload debug app
        uses: actions/upload-artifact@v7
        with:
          name: FuoEvolve-debug-ios-simulator
          path: build/artifacts/FuoEvolve-debug-ios-simulator.tar
          archive: false
          if-no-files-found: error

      - name: Upload debug IPA
        uses: actions/upload-artifact@v7
        with:
          name: FuoEvolve-debug-ios-ipa
          path: build/artifacts/FuoEvolve-debug-ios.ipa
          archive: false
          if-no-files-found: error
