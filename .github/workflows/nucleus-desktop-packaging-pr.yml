name: Nucleus Desktop Packaging PR

"on":
  pull_request:
    paths:
      - ".github/workflows/desktop-packaging.yml"
      - ".github/workflows/desktop-tests.yml"
      - ".github/workflows/nucleus-desktop-packaging-pr.yml"
      - "desktopNucleusPoc/**"
      - "desktopRuntime/**"
      - "desktopApp/native/web-login/**"
      - "desktopApp/packaging/native-deps.lock"
      - "desktopApp/packaging/macos/prepare-libmpv.sh"
      - "shared/src/desktopMain/**"
      - "settings.gradle.kts"

concurrency:
  group: nucleus-desktop-packaging-pr-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  packages:
    name: Nucleus packages
    uses: ./.github/workflows/desktop-packaging.yml
