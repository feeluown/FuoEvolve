name: Apply update retry policy wiring

on:
  push:
    branches:
      - fix/android-update-launch-retry

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/android-update-launch-retry

      - name: Wire retry policy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('shared/src/commonMain/kotlin/org/feeluown/mobile/feature/settings/AppUpdateFeatureSettings.kt')
          text = path.read_text()
          old = '                    val retryUpdate = update.remoteVersionCode?.let { it > update.installedVersionCode } == true'
          new = '''                    val retryUpdate = shouldRetryKnownAppUpdate(
                        installedVersionCode = update.installedVersionCode,
                        remoteVersionCode = update.remoteVersionCode,
                    )'''
          if old not in text:
              raise SystemExit('retry policy line not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit retry policy wiring
        shell: bash
        run: |
          rm .github/workflows/apply-update-retry-policy.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test: wire app update retry policy"
          git push origin HEAD:fix/android-update-launch-retry
