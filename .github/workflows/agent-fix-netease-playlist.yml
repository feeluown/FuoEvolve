name: Apply NetEase playlist mutation fix

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply focused source changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match in {path}, found {count}")
              file.write_text(text.replace(old, new, 1))

          netease = "shared/src/commonMain/kotlin/org/feeluown/mobile/provider/netease/NeteaseProvider.kt"
          controller = "shared/src/commonMain/kotlin/org/feeluown/mobile/FuoPlayerController.kt"

          replace_once(
              netease,
              '''import io.ktor.http.Parameters
          import kotlinx.serialization.json.JsonElement''',
              '''import io.ktor.http.Parameters
          import kotlinx.coroutines.delay
          import kotlinx.serialization.json.JsonElement''',
          )

          replace_once(
              netease,
              '''    override suspend fun createPlaylist(name: String): ProviderMutationResult {
                  val uid = currentUserId() ?: return ProviderMutationResult(false, "无法读取网易云音乐用户信息")
                  val root = http.postForm(
                      ID,
                      "$BASE/api/playlist/create",
                      Parameters.build { append("uid", uid); append("name", name) },
                      neteaseAuthenticatedHeaders(),
                      ProviderRequestKind.Mutation,
                  )
                      .value.let { providerJson.parseToJsonElement(it).asObject() }
                  return mutation(root, "已新建：$name")
              }

              override suspend fun deletePlaylist(playlist: ProviderPlaylist): ProviderMutationResult {
                  val (_, identifier) = splitResourceId(playlist.id, "playlist")
                  val root = http.postForm(ID, "$BASE/api/playlist/delete", Parameters.build { append("id", identifier); append("pid", identifier) }, authenticatedHeaders(), ProviderRequestKind.Mutation)
                      .value.let { providerJson.parseToJsonElement(it).asObject() }
                  return mutation(root, "已删除：${playlist.title}")
              }''',
              '''    override suspend fun createPlaylist(name: String): ProviderMutationResult {
                  val uid = currentUserId() ?: return ProviderMutationResult(false, "无法读取网易云音乐用户信息")
                  val knownPlaylistIds: Set<String> = runCatching {
                      userPlaylistObjects(uid).map { it.string("id") }.toSet()
                  }.getOrDefault(emptySet())
                  val root = http.postForm(
                      ID,
                      "$BASE/api/playlist/create",
                      Parameters.build { append("uid", uid); append("name", name) },
                      neteaseAuthenticatedHeaders(),
                      ProviderRequestKind.Mutation,
                  )
                      .value.let { providerJson.parseToJsonElement(it).asObject() }
                  val result = mutation(root, "已新建：$name")
                  if (result.success) {
                      val createdId = root.obj("playlist")?.stringOrNull("id") ?: root.stringOrNull("id")
                      awaitPlaylistMutationVisible(uid) { playlists ->
                          when {
                              createdId != null -> playlists.any { it.string("id") == createdId }
                              knownPlaylistIds.isNotEmpty() -> playlists.any { it.string("id") !in knownPlaylistIds }
                              else -> false
                          }
                      }
                  }
                  return result
              }

              override suspend fun deletePlaylist(playlist: ProviderPlaylist): ProviderMutationResult {
                  val (_, identifier) = splitResourceId(playlist.id, "playlist")
                  val root = neteaseWeApiPost(
                      "$BASE/weapi/playlist/remove",
                      """{"ids":"[$identifier]","csrf_token":"${csrfToken().jsonString()}"}""",
                      ProviderRequestKind.Mutation,
                  )
                  val result = mutation(root, "已删除：${playlist.title}")
                  if (result.success) {
                      currentUserId()?.let { uid ->
                          awaitPlaylistMutationVisible(uid) { playlists ->
                              playlists.none { it.string("id") == identifier }
                          }
                      }
                  }
                  return result
              }''',
          )

          replace_once(
              netease,
              '''    private suspend fun neteaseWeApiPost(url: String, json: String): JsonObject {
                  val payload = NeteaseWeApi.encrypt(json)
                  return http.postForm(
                      providerId = ID,
                      url = url,
                      form = Parameters.build {
                          append("params", payload.params)
                          append("encSecKey", payload.encSecKey)
                      },
                      headers = neteaseAuthenticatedHeaders(mapOf("Referer" to "https://music.163.com/")),
                      kind = ProviderRequestKind.Auth,
                      cacheKey = null,
                  ).value.let { parseNeteaseResponse(it) }
              }''',
              '''    private suspend fun neteaseWeApiPost(
                  url: String,
                  json: String,
                  kind: ProviderRequestKind = ProviderRequestKind.Auth,
              ): JsonObject {
                  val payload = NeteaseWeApi.encrypt(json)
                  return http.postForm(
                      providerId = ID,
                      url = url,
                      form = Parameters.build {
                          append("params", payload.params)
                          append("encSecKey", payload.encSecKey)
                      },
                      headers = neteaseAuthenticatedHeaders(mapOf("Referer" to "https://music.163.com/")),
                      kind = kind,
                      cacheKey = null,
                  ).value.let { parseNeteaseResponse(it) }
              }''',
          )

          replace_once(
              netease,
              '''    private suspend fun userPlaylistObjects(uid: String): List<JsonObject> = http.getText(
                  ID,
                  queryUrl("$BASE/api/user/playlist/", mapOf("uid" to uid, "limit" to "100")),
                  neteaseAuthenticatedHeaders(),
                  cacheKey = null,
              ).value.let { parseNeteaseResponse(it) }.array("playlist").map { it.asObject() }

              private fun parseNeteaseResponse(raw: String): JsonObject {''',
              '''    private suspend fun userPlaylistObjects(uid: String): List<JsonObject> = http.getText(
                  ID,
                  queryUrl("$BASE/api/user/playlist/", mapOf("uid" to uid, "limit" to "100")),
                  neteaseAuthenticatedHeaders(),
                  cacheKey = null,
              ).value.let { parseNeteaseResponse(it) }.array("playlist").map { it.asObject() }

              private suspend fun awaitPlaylistMutationVisible(
                  uid: String,
                  predicate: (List<JsonObject>) -> Boolean,
              ) {
                  repeat(PLAYLIST_MUTATION_SYNC_ATTEMPTS) { attempt ->
                      val playlists = runCatching { userPlaylistObjects(uid) }.getOrNull()
                      if (playlists != null && predicate(playlists)) return
                      if (attempt < PLAYLIST_MUTATION_SYNC_ATTEMPTS - 1) {
                          delay(PLAYLIST_MUTATION_SYNC_DELAY_MS)
                      }
                  }
              }

              private fun parseNeteaseResponse(raw: String): JsonObject {''',
          )

          replace_once(
              netease,
              '''    private companion object {
                  const val ID = "netease"
                  const val NAME = "网易云音乐"
                  const val BASE = "https://music.163.com"''',
              '''    private companion object {
                  const val ID = "netease"
                  const val NAME = "网易云音乐"
                  const val BASE = "https://music.163.com"
                  const val PLAYLIST_MUTATION_SYNC_ATTEMPTS = 6
                  const val PLAYLIST_MUTATION_SYNC_DELAY_MS = 200L''',
          )

          replace_once(
              controller,
              '''    fun createPlaylist(providerId: String, name: String) {
                  if (name.isBlank() || providerId !in creatablePlaylistProviders().map { it.providerId }) return
                  scope.launch {
                      isLoading = true
                      message = "正在新建歌单"
                      runCatching { providerRepository.createPlaylist(providerId, name.trim()) }
                          .onSuccess { result ->
                              message = result.message.ifBlank { if (result.success) "歌单已新建" else "新建歌单失败" }
                              if (result.success) refreshAfterProviderMutation(providerId)
                          }
                          .onFailure(::setError)
                      isLoading = false
                  }
              }''',
              '''    fun createPlaylist(providerId: String, name: String) {
                  if (name.isBlank() || providerId !in creatablePlaylistProviders().map { it.providerId }) return
                  scope.launch {
                      isLoading = true
                      message = "正在新建歌单"
                      runCatching { providerRepository.createPlaylist(providerId, name.trim()) }
                          .onSuccess { result ->
                              message = result.message.ifBlank { if (result.success) "歌单已新建" else "新建歌单失败" }
                              playlistOperationFeedback = message
                              if (result.success) refreshAfterProviderMutation(providerId)
                          }
                          .onFailure {
                              setError(it)
                              playlistOperationFeedback = message
                          }
                      isLoading = false
                  }
              }''',
          )

          replace_once(
              controller,
              '''    fun deleteSelectedPlaylist() {
                  val playlist = selectedPlaylist ?: return
                  if (!canDeleteSelectedPlaylist()) return
                  scope.launch {
                      isLoading = true
                      message = "正在删除歌单"
                      runCatching { providerRepository.deletePlaylist(playlist) }
                          .onSuccess { result ->
                              message = result.message.ifBlank { if (result.success) "歌单已删除" else "删除歌单失败" }
                              if (result.success) {
                                  closePlaylist()
                                  refreshAfterProviderMutation(playlist.providerId)
                              }
                          }
                          .onFailure(::setError)
                      isLoading = false
                  }
              }''',
              '''    fun deleteSelectedPlaylist() {
                  val playlist = selectedPlaylist ?: return
                  if (!canDeleteSelectedPlaylist()) return
                  scope.launch {
                      isLoading = true
                      message = "正在删除歌单"
                      runCatching { providerRepository.deletePlaylist(playlist) }
                          .onSuccess { result ->
                              message = result.message.ifBlank { if (result.success) "歌单已删除" else "删除歌单失败" }
                              playlistOperationFeedback = message
                              if (result.success) {
                                  closePlaylist()
                                  refreshAfterProviderMutation(playlist.providerId)
                              }
                          }
                          .onFailure {
                              setError(it)
                              playlistOperationFeedback = message
                          }
                      isLoading = false
                  }
              }''',
          )

          test_file = Path("shared/src/commonTest/kotlin/org/feeluown/mobile/NeteasePlaylistMutationTest.kt")
          test_file.write_text('''package org.feeluown.mobile

          import io.ktor.client.HttpClient
          import io.ktor.client.engine.mock.MockEngine
          import io.ktor.client.engine.mock.respond
          import kotlinx.coroutines.test.runTest
          import kotlin.test.Test
          import kotlin.test.assertEquals
          import kotlin.test.assertTrue
          import org.feeluown.mobile.provider.core.InMemoryProviderCredentialStore
          import org.feeluown.mobile.provider.core.network.ProviderHttpClient
          import org.feeluown.mobile.provider.netease.NeteaseProvider

          class NeteasePlaylistMutationTest {
              @Test
              fun createPlaylistWaitsUntilUserPlaylistListContainsNewPlaylist() = runTest {
                  var playlistRequests = 0
                  val requestedPaths = mutableListOf<String>()
                  val client = ProviderHttpClient(
                      HttpClient(MockEngine) {
                          engine {
                              addHandler { request ->
                                  val path = request.url.encodedPath
                                  requestedPaths += path
                                  when (path) {
                                      "/api/user/level" -> respond("""{"code":200,"data":{"userId":12345}}""")
                                      "/weapi/share/userprofile/info" -> respond("""{"code":200,"nickname":"tester"}""")
                                      "/api/playlist/create" -> respond("""{"code":200,"playlist":{"id":777,"name":"新歌单"}}""")
                                      "/api/user/playlist/" -> {
                                          playlistRequests += 1
                                          val playlists = if (playlistRequests >= 3) {
                                              """[{"id":1,"name":"已有歌单","subscribed":false},{"id":777,"name":"新歌单","subscribed":false}]"""
                                          } else {
                                              """[{"id":1,"name":"已有歌单","subscribed":false}]"""
                                          }
                                          respond("""{"code":200,"playlist":$playlists}""")
                                      }
                                      else -> error("unexpected NetEase request: $path")
                                  }
                              }
                          }
                      },
                  )
                  val provider = NeteaseProvider(client, InMemoryProviderCredentialStore())
                  provider.loginWithCookies("""{"MUSIC_U":"music-cookie","__csrf":"csrf"}""")

                  val result = provider.createPlaylist("新歌单")

                  assertTrue(result.success)
                  assertEquals(3, playlistRequests)
                  assertTrue("/api/playlist/create" in requestedPaths)
                  client.close()
              }

              @Test
              fun deletePlaylistUsesWeApiRemoveAndWaitsUntilPlaylistDisappears() = runTest {
                  var playlistRequests = 0
                  val requestedPaths = mutableListOf<String>()
                  val client = ProviderHttpClient(
                      HttpClient(MockEngine) {
                          engine {
                              addHandler { request ->
                                  val path = request.url.encodedPath
                                  requestedPaths += path
                                  when (path) {
                                      "/api/user/level" -> respond("""{"code":200,"data":{"userId":12345}}""")
                                      "/weapi/share/userprofile/info" -> respond("""{"code":200,"nickname":"tester"}""")
                                      "/weapi/playlist/remove" -> respond("""{"code":200}""")
                                      "/api/user/playlist/" -> {
                                          playlistRequests += 1
                                          val playlists = if (playlistRequests >= 3) {
                                              "[]"
                                          } else {
                                              """[{"id":321,"name":"待删除歌单","subscribed":false}]"""
                                          }
                                          respond("""{"code":200,"playlist":$playlists}""")
                                      }
                                      else -> error("unexpected NetEase request: $path")
                                  }
                              }
                          }
                      },
                  )
                  val provider = NeteaseProvider(client, InMemoryProviderCredentialStore())
                  provider.loginWithCookies("""{"MUSIC_U":"music-cookie","__csrf":"csrf"}""")
                  val section = provider.loadFeature(
                      provider.features.single { it.id == "netease_user_playlists" },
                      0,
                      50,
                  )

                  val result = provider.deletePlaylist(section.playlists.single())

                  assertTrue(result.success)
                  assertEquals(3, playlistRequests)
                  assertTrue("/weapi/playlist/remove" in requestedPaths)
                  assertTrue("/api/playlist/delete" !in requestedPaths)
                  client.close()
              }
          }
          '''.replace("\n          ", "\n"))
          PY

      - name: Run focused NetEase playlist tests
        run: ./gradlew :shared:testDebugUnitTest --tests org.feeluown.mobile.NeteasePlaylistMutationTest --no-daemon

      - name: Commit validated fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            shared/src/commonMain/kotlin/org/feeluown/mobile/provider/netease/NeteaseProvider.kt \
            shared/src/commonMain/kotlin/org/feeluown/mobile/FuoPlayerController.kt \
            shared/src/commonTest/kotlin/org/feeluown/mobile/NeteasePlaylistMutationTest.kt
          git commit -m "fix: repair NetEase playlist mutations"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
