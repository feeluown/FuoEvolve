name: Android APK

"on":
  push:
    branches:
      - master
    paths:
      - "androidApp/**"
      - "shared/**"
      - "core/**"
      - "feature/**"
      - "playback/**"
      - "provider/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "fdroid/**"
      - "scripts/build-fdroid-pages.sh"
      - "scripts/write-update-manifest.sh"
      - ".github/workflows/android-apk.yml"
      - ".github/workflows/android-tests.yml"
  pull_request:
    paths:
      - "androidApp/**"
      - "shared/**"
      - "core/**"
      - "feature/**"
      - "playback/**"
      - "provider/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "fdroid/**"
      - "scripts/build-fdroid-pages.sh"
      - "scripts/write-update-manifest.sh"
      - ".github/workflows/android-apk.yml"
      - ".github/workflows/android-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/android-tests.yml

  build-release-apks:
    name: Build signed multi-ABI release APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FUO_SIGNING_STORE_FILE: ${{ github.workspace }}/signing/fuo-evolve.jks
      FUO_SIGNING_STORE_PASSWORD: ${{ secrets.FUO_SIGNING_STORE_PASSWORD }}
      FUO_SIGNING_KEY_ALIAS: ${{ secrets.FUO_SIGNING_KEY_ALIAS }}
      FUO_SIGNING_KEY_PASSWORD: ${{ secrets.FUO_SIGNING_KEY_PASSWORD }}
      FUO_SIGNING_KEYSTORE_BASE64: ${{ secrets.FUO_SIGNING_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate update scripts
        run: bash -n scripts/build-fdroid-pages.sh scripts/write-update-manifest.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: https://gradle.com/terms-of-service
          build-scan-terms-of-use-agree: "yes"

      - name: Prepare signing keystore
        run: |
          for name in FUO_SIGNING_KEYSTORE_BASE64 FUO_SIGNING_STORE_PASSWORD FUO_SIGNING_KEY_ALIAS FUO_SIGNING_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required signing secret: ${name}"
              exit 1
            fi
          done
          mkdir -p "$(dirname "$FUO_SIGNING_STORE_FILE")"
          printf '%s' "$FUO_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$FUO_SIGNING_STORE_FILE"

      - name: Build signed release APK
        run: ./gradlew :androidApp:assembleRelease

      - name: Prepare signed release APK artifact
        id: artifact
        env:
          RELEASE_APK_GLOB: androidApp/build/outputs/apk/release/*.apk
        run: |
          mkdir -p build/artifacts
          mapfile -t apks < <(compgen -G "$RELEASE_APK_GLOB" || true)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one multi-ABI release APK, found ${#apks[@]}"
            printf '%s\n' "${apks[@]}"
            exit 1
          fi
          artifact_path="build/artifacts/fuo-evolve-release-multi-abi-signed-${GITHUB_SHA}.apk"
          cp "${apks[0]}" "$artifact_path"
          echo "path=$artifact_path" >> "$GITHUB_OUTPUT"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v7
        with:
          name: fuo-evolve-release-multi-abi-signed-${{ github.sha }}
          path: ${{ steps.artifact.outputs.path }}
          archive: false
          if-no-files-found: error

  publish-canary-pages:
    name: Publish master Canary update
    needs: build-release-apks
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: fuoevolve-github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      FUO_SIGNING_KEYSTORE_BASE64: ${{ secrets.FUO_SIGNING_KEYSTORE_BASE64 }}
      FUO_SIGNING_STORE_PASSWORD: ${{ secrets.FUO_SIGNING_STORE_PASSWORD }}
      FUO_SIGNING_KEY_ALIAS: ${{ secrets.FUO_SIGNING_KEY_ALIAS }}
      FUO_SIGNING_KEY_PASSWORD: ${{ secrets.FUO_SIGNING_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      FDROID_DOCKER_IMAGE: registry.gitlab.com/fdroid/docker-executable-fdroidserver:master

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download current master APK artifact
        uses: actions/download-artifact@v8
        with:
          name: fuo-evolve-release-multi-abi-signed-${{ github.sha }}
          path: build/canary

      - name: Build F-Droid repository and Pages base
        run: |
          docker pull "$FDROID_DOCKER_IMAGE"
          bash scripts/build-fdroid-pages.sh

      - name: Publish current build as Canary
        env:
          CANARY_APK: build/canary/fuo-evolve-release-multi-abi-signed-${{ github.sha }}.apk
          CANARY_URL: https://feeluown.github.io/FuoEvolve/update/fuo-evolve-canary.apk
        run: |
          test -f "$CANARY_APK"
          mkdir -p build/pages/update
          cp "$CANARY_APK" build/pages/update/fuo-evolve-canary.apk
          COMMIT_SHA="$GITHUB_SHA" \
          WORKFLOW_RUN_ID="$GITHUB_RUN_ID" \
          RELEASE_NOTES_URL="https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}" \
            bash scripts/write-update-manifest.sh \
              canary \
              build/pages/update/fuo-evolve-canary.apk \
              build/pages/update/canary.json \
              "$CANARY_URL"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
