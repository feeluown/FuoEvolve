name: Android APK

"on":
  push:
    branches:
      - master
    paths:
      - "androidApp/**"
      - "shared/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "scripts/build-onnxruntime-mobile.sh"
      - "scripts/verify-android-flavor-apks.sh"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "androidApp/**"
      - "shared/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "scripts/build-onnxruntime-mobile.sh"
      - "scripts/verify-android-flavor-apks.sh"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Run shared tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run shared tests and generate coverage
        run: ./gradlew :shared:allTests :shared:koverXmlReportDebug :shared:koverVerifyDebug

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          disable_search: true
          fail_ci_if_error: true
          files: shared/build/reports/kover/reportDebug.xml
          flags: unittests
          use_oidc: true

  build-release-apks:
    name: Build signed standard and smart release APKs
    runs-on: ubuntu-latest
    environment: android-apk
    timeout-minutes: 45
    env:
      FUO_SIGNING_STORE_FILE: ${{ github.workspace }}/signing/fuo-evolve.jks
      FUO_SIGNING_STORE_PASSWORD: ${{ secrets.FUO_SIGNING_STORE_PASSWORD }}
      FUO_SIGNING_KEY_ALIAS: ${{ secrets.FUO_SIGNING_KEY_ALIAS }}
      FUO_SIGNING_KEY_PASSWORD: ${{ secrets.FUO_SIGNING_KEY_PASSWORD }}
      FUO_SIGNING_KEYSTORE_BASE64: ${{ secrets.FUO_SIGNING_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: https://gradle.com/terms-of-service
          build-scan-terms-of-use-agree: "yes"

      - name: Prepare signing keystore
        run: |
          for name in FUO_SIGNING_KEYSTORE_BASE64 FUO_SIGNING_STORE_PASSWORD FUO_SIGNING_KEY_ALIAS FUO_SIGNING_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required signing secret: ${name}"
              exit 1
            fi
          done
          mkdir -p "$(dirname "$FUO_SIGNING_STORE_FILE")"
          printf '%s' "$FUO_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$FUO_SIGNING_STORE_FILE"

      - name: Build signed release APKs
        run: ./gradlew :androidApp:assembleStandardRelease :androidApp:assembleSmartRelease

      - name: Prepare signed release APK artifacts
        id: artifact
        env:
          STANDARD_APK_GLOB: androidApp/build/outputs/apk/standard/release/*universal*.apk
          SMART_ARM64_APK_GLOB: androidApp/build/outputs/apk/smart/release/*arm64-v8a*.apk
          SMART_X86_64_APK_GLOB: androidApp/build/outputs/apk/smart/release/*x86_64*.apk
        run: |
          mkdir -p build/artifacts
          mapfile -t standard_apks < <(compgen -G "$STANDARD_APK_GLOB" || true)
          mapfile -t smart_arm64_apks < <(compgen -G "$SMART_ARM64_APK_GLOB" || true)
          mapfile -t smart_x86_64_apks < <(compgen -G "$SMART_X86_64_APK_GLOB" || true)
          if [ "${#standard_apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one standard universal release APK, found ${#standard_apks[@]}"
            printf '%s\n' "${standard_apks[@]}"
            exit 1
          fi
          if [ "${#smart_arm64_apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one smart arm64-v8a release APK, found ${#smart_arm64_apks[@]}"
            printf '%s\n' "${smart_arm64_apks[@]}"
            exit 1
          fi
          if [ "${#smart_x86_64_apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one smart x86_64 release APK, found ${#smart_x86_64_apks[@]}"
            printf '%s\n' "${smart_x86_64_apks[@]}"
            exit 1
          fi
          standard_path="build/artifacts/fuo-evolve-release-multi-abi-signed-${GITHUB_SHA}.apk"
          smart_arm64_path="build/artifacts/fuo-evolve-release-smart-arm64-v8a-signed-${GITHUB_SHA}.apk"
          smart_x86_64_path="build/artifacts/fuo-evolve-release-smart-x86_64-signed-${GITHUB_SHA}.apk"
          cp "${standard_apks[0]}" "$standard_path"
          cp "${smart_arm64_apks[0]}" "$smart_arm64_path"
          cp "${smart_x86_64_apks[0]}" "$smart_x86_64_path"
          echo "standard_path=$standard_path" >> "$GITHUB_OUTPUT"
          echo "smart_arm64_path=$smart_arm64_path" >> "$GITHUB_OUTPUT"
          echo "smart_x86_64_path=$smart_x86_64_path" >> "$GITHUB_OUTPUT"

      - name: Verify release APK identities and flavor isolation
        env:
          STANDARD_APK: ${{ steps.artifact.outputs.standard_path }}
          SMART_ARM64_APK: ${{ steps.artifact.outputs.smart_arm64_path }}
          SMART_X86_64_APK: ${{ steps.artifact.outputs.smart_x86_64_path }}
        run: bash scripts/verify-android-flavor-apks.sh "$STANDARD_APK" "$SMART_ARM64_APK" "$SMART_X86_64_APK"

      - name: Upload signed standard release APK
        uses: actions/upload-artifact@v7
        with:
          name: fuo-evolve-release-multi-abi-signed-${{ github.sha }}
          path: ${{ steps.artifact.outputs.standard_path }}
          archive: false
          if-no-files-found: error

      - name: Upload signed smart arm64-v8a release APK
        uses: actions/upload-artifact@v7
        with:
          name: fuo-evolve-release-smart-arm64-v8a-signed-${{ github.sha }}
          path: ${{ steps.artifact.outputs.smart_arm64_path }}
          archive: false
          if-no-files-found: error

      - name: Upload signed smart x86_64 release APK
        uses: actions/upload-artifact@v7
        with:
          name: fuo-evolve-release-smart-x86_64-signed-${{ github.sha }}
          path: ${{ steps.artifact.outputs.smart_x86_64_path }}
          archive: false
          if-no-files-found: error
