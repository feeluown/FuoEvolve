name: Android APK

"on":
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: write

jobs:
  apply-p0-pagination-patch:
    name: Apply scoped P0 pagination patch
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.ref == 'agent/netease-p0-content'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Patch provider feature pagination
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          controller_path = Path('shared/src/commonMain/kotlin/org/feeluown/mobile/FuoPlayerController.kt')
          controller = controller_path.read_text()

          prefetch_pattern = re.compile(
              r"    fun prefetchSelectedFeatureIfNeeded\(visibleIndex: Int\) \{.*?\n    \}\n\n"
              r"    fun prefetchSelectedPlaylistIfNeeded",
              re.S,
          )
          new_prefetch = "\n".join([
              "    fun prefetchSelectedFeatureIfNeeded(visibleIndex: Int) {",
              "        val contentCount = selectedFeatureContent?.contentCount() ?: selectedFeatureTracks.size",
              "        if (contentCount - visibleIndex <= LIST_PREFETCH_REMAINING) {",
              "            loadMoreSelectedFeatureTracks()",
              "        }",
              "    }",
              "",
              "    fun loadMoreSelectedFeature() {",
              "        loadMoreSelectedFeatureTracks()",
              "    }",
              "",
              "    fun prefetchSelectedPlaylistIfNeeded",
          ])
          controller, count = prefetch_pattern.subn(new_prefetch, controller, count=1)
          if count != 1:
              raise SystemExit(f'prefetchSelectedFeatureIfNeeded regex matched {count} blocks')

          append_pattern = re.compile(
              r"    private suspend fun appendSelectedFeatureTracksPage\(\): Boolean \{.*?\n    \}\n\n"
              r"    private fun loadMoreSelectedPlaylistTracks",
              re.S,
          )
          new_append = "\n".join([
              "    private suspend fun appendSelectedFeatureTracksPage(): Boolean {",
              "        val feature = selectedFeature ?: return false",
              "        if (feature.isDynamicQueueFeature() || !selectedFeatureTracksHasMore) return false",
              "        val offset = selectedFeatureTracksNextOffset",
              "        return runCatching {",
              "            withTimeout(30_000) {",
              "                providerRepository.loadFeaturePage(feature, offset)",
              "            }",
              "        }.fold(",
              "            onSuccess = { section ->",
              "                if (selectedFeature != feature) return false",
              "                val current = selectedFeatureContent ?: ProviderContentSection(feature)",
              "                val seenTrackIds = current.tracks.mapTo(mutableSetOf()) { it.id }",
              "                val newTracks = section.tracks.filter { seenTrackIds.add(it.id) }",
              "                val seenPlaylistIds = current.playlists.mapTo(mutableSetOf()) { it.id }",
              "                val newPlaylists = section.playlists.filter { seenPlaylistIds.add(it.id) }",
              "                val seenMediaItemIds = current.mediaItems.mapTo(mutableSetOf()) { it.id }",
              "                val newMediaItems = section.mediaItems.filter { seenMediaItemIds.add(it.id) }",
              "                val seenVideoIds = current.videos.mapTo(mutableSetOf()) { it.id }",
              "                val newVideos = section.videos.filter { seenVideoIds.add(it.id) }",
              "",
              "                val updatedSection = section.copy(",
              "                    tracks = current.tracks + newTracks,",
              "                    playlists = current.playlists + newPlaylists,",
              "                    mediaItems = current.mediaItems + newMediaItems,",
              "                    videos = current.videos + newVideos,",
              "                    nextOffset = section.nextOffset,",
              "                    hasMore = section.hasMore,",
              "                )",
              "                selectedFeatureTracks = updatedSection.tracks",
              "                selectedFeatureContent = updatedSection",
              "                updateHomeFeatureSection(updatedSection)",
              "                selectedFeatureTracksNextOffset = section.nextOffset",
              "                selectedFeatureTracksHasMore = section.hasMore",
              "                val contentChanged = newTracks.isNotEmpty() ||",
              "                    newPlaylists.isNotEmpty() ||",
              "                    newMediaItems.isNotEmpty() ||",
              "                    newVideos.isNotEmpty()",
              "                section.nextOffset != offset || contentChanged",
              "            },",
              "            onFailure = {",
              "                selectedFeatureError = it.message ?: it::class.simpleName.orEmpty()",
              "                false",
              "            },",
              "        )",
              "    }",
              "",
              "    private fun loadMoreSelectedPlaylistTracks",
          ])
          controller, count = append_pattern.subn(new_append, controller, count=1)
          if count != 1:
              raise SystemExit(f'appendSelectedFeatureTracksPage regex matched {count} blocks')
          controller_path.write_text(controller)

          screen_path = Path('shared/src/commonMain/kotlin/org/feeluown/mobile/ProviderDetailScreens.kt')
          screen = screen_path.read_text()
          content_pattern = re.compile(
              r"        content\?\.playlists\?\.isNotEmpty\(\) == true -> LazyColumn\(modifier = modifier\) \{.*?"
              r"\n        else -> TrackCollectionList",
              re.S,
          )
          new_content = "\n".join([
              "        content?.playlists?.isNotEmpty() == true -> LazyColumn(modifier = modifier) {",
              "            item {",
              "                ProviderPlaylistGrid(",
              "                    playlists = content.playlists,",
              "                    onClick = { controller.openPlaylist(it, content.feature.category) },",
              "                )",
              "            }",
              "            if (content.hasMore) {",
              "                item {",
              "                    Box(modifier = Modifier.fillMaxWidth(), contentAlignment = Alignment.Center) {",
              "                        TextButton(onClick = controller::loadMoreSelectedFeature) { Text(\"加载更多\") }",
              "                    }",
              "                }",
              "            }",
              "        }",
              "        content?.mediaItems?.isNotEmpty() == true -> LazyColumn(modifier = modifier) {",
              "            item {",
              "                ProviderMediaItemGrid(",
              "                    items = content.mediaItems,",
              "                    onClick = controller::openMediaItem,",
              "                )",
              "            }",
              "            if (content.hasMore) {",
              "                item {",
              "                    Box(modifier = Modifier.fillMaxWidth(), contentAlignment = Alignment.Center) {",
              "                        TextButton(onClick = controller::loadMoreSelectedFeature) { Text(\"加载更多\") }",
              "                    }",
              "                }",
              "            }",
              "        }",
              "        content?.videos?.isNotEmpty() == true -> LazyColumn(modifier = modifier) {",
              "            item {",
              "                ProviderVideoList(videos = content.videos, onClick = controller::openVideo)",
              "            }",
              "            if (content.hasMore) {",
              "                item {",
              "                    Box(modifier = Modifier.fillMaxWidth(), contentAlignment = Alignment.Center) {",
              "                        TextButton(onClick = controller::loadMoreSelectedFeature) { Text(\"加载更多\") }",
              "                    }",
              "                }",
              "            }",
              "        }",
              "        else -> TrackCollectionList",
          ])
          screen, count = content_pattern.subn(new_content, screen, count=1)
          if count != 1:
              raise SystemExit(f'SelectedFeatureContent regex matched {count} blocks')
          screen_path.write_text(screen)
          PY

      - name: Restore temporary workflow files
        run: |
          git checkout origin/master -- .github/workflows/android-apk.yml
          git rm -f .github/workflows/agent-p0-pagination-patch.yml .agent-p0-pagination-trigger

      - name: Commit pagination support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "support pagination for provider feature content"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  build-release-apks:
    name: Build signed multi-ABI release APK
    runs-on: ubuntu-latest
    environment: android-apk
    timeout-minutes: 45
    env:
      FUO_SIGNING_STORE_FILE: ${{ github.workspace }}/signing/fuo-evolve.jks
      FUO_SIGNING_STORE_PASSWORD: ${{ secrets.FUO_SIGNING_STORE_PASSWORD }}
      FUO_SIGNING_KEY_ALIAS: ${{ secrets.FUO_SIGNING_KEY_ALIAS }}
      FUO_SIGNING_KEY_PASSWORD: ${{ secrets.FUO_SIGNING_KEY_PASSWORD }}
      FUO_SIGNING_KEYSTORE_BASE64: ${{ secrets.FUO_SIGNING_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: https://gradle.com/terms-of-service
          build-scan-terms-of-use-agree: "yes"

      - name: Prepare signing keystore
        run: |
          for name in FUO_SIGNING_KEYSTORE_BASE64 FUO_SIGNING_STORE_PASSWORD FUO_SIGNING_KEY_ALIAS FUO_SIGNING_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required signing secret: ${name}"
              exit 1
            fi
          done
          mkdir -p "$(dirname "$FUO_SIGNING_STORE_FILE")"
          printf '%s' "$FUO_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$FUO_SIGNING_STORE_FILE"

      - name: Build signed release APK
        run: ./gradlew :androidApp:assembleRelease

      - name: Prepare signed release APK artifact
        id: artifact
        env:
          RELEASE_APK_GLOB: androidApp/build/outputs/apk/release/*.apk
        run: |
          mkdir -p build/artifacts
          mapfile -t apks < <(compgen -G "$RELEASE_APK_GLOB" || true)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one multi-ABI release APK, found ${#apks[@]}"
            printf '%s\n' "${apks[@]}"
            exit 1
          fi
          artifact_path="build/artifacts/fuo-evolve-release-multi-abi-signed-${GITHUB_SHA}.apk"
          cp "${apks[0]}" "$artifact_path"
          echo "path=$artifact_path" >> "$GITHUB_OUTPUT"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v7
        with:
          name: fuo-evolve-release-multi-abi-signed-${{ github.sha }}
          path: ${{ steps.artifact.outputs.path }}
          archive: false
          if-no-files-found: error
