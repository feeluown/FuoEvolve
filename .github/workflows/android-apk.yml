name: Android APK

"on":
  push:
    branches:
      - master
    paths:
      - "androidApp/**"
      - "shared/**"
      - "core/**"
      - "feature/**"
      - "playback/**"
      - "provider/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "scripts/write-update-manifest.sh"
      - ".github/workflows/android-apk.yml"
      - ".github/workflows/android-tests.yml"
  pull_request:
    paths:
      - "androidApp/**"
      - "shared/**"
      - "core/**"
      - "feature/**"
      - "playback/**"
      - "provider/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "scripts/write-update-manifest.sh"
      - ".github/workflows/android-apk.yml"
      - ".github/workflows/android-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/android-tests.yml

  build-release-apks:
    name: Build signed multi-ABI release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FUO_SIGNING_STORE_FILE: ${{ github.workspace }}/signing/fuo-evolve.jks
      FUO_SIGNING_STORE_PASSWORD: ${{ secrets.FUO_SIGNING_STORE_PASSWORD }}
      FUO_SIGNING_KEY_ALIAS: ${{ secrets.FUO_SIGNING_KEY_ALIAS }}
      FUO_SIGNING_KEY_PASSWORD: ${{ secrets.FUO_SIGNING_KEY_PASSWORD }}
      FUO_SIGNING_KEYSTORE_BASE64: ${{ secrets.FUO_SIGNING_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare Git refs for Gradle versioning
        run: git branch --force master origin/master

      - name: Validate update manifest script
        run: bash -n scripts/write-update-manifest.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          build-scan-publish: true
          build-scan-terms-of-use-url: https://gradle.com/terms-of-service
          build-scan-terms-of-use-agree: "yes"

      - name: Prepare signing keystore
        run: |
          for name in FUO_SIGNING_KEYSTORE_BASE64 FUO_SIGNING_STORE_PASSWORD FUO_SIGNING_KEY_ALIAS FUO_SIGNING_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required signing secret: ${name}"
              exit 1
            fi
          done
          mkdir -p "$(dirname "$FUO_SIGNING_STORE_FILE")"
          printf '%s' "$FUO_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$FUO_SIGNING_STORE_FILE"

      - name: Build signed release APK
        env:
          GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
        run: |
          if [ -n "$GRADLE_ENCRYPTION_KEY" ]; then
            echo "Using Gradle configuration cache."
            ./gradlew --configuration-cache :androidApp:assembleRelease
          else
            echo "::warning::GRADLE_ENCRYPTION_KEY is not configured; configuration cache persistence is disabled."
            ./gradlew --no-configuration-cache :androidApp:assembleRelease
          fi

      - name: Prepare signed release APK artifact
        id: artifact
        env:
          RELEASE_APK_GLOB: androidApp/build/outputs/apk/release/*.apk
        run: |
          mkdir -p build/artifacts
          mapfile -t apks < <(compgen -G "$RELEASE_APK_GLOB" || true)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one multi-ABI release APK, found ${#apks[@]}"
            printf '%s\n' "${apks[@]}"
            exit 1
          fi
          artifact_path="build/artifacts/fuo-evolve-release-multi-abi-signed-${GITHUB_SHA}.apk"
          cp "${apks[0]}" "$artifact_path"
          echo "path=$artifact_path" >> "$GITHUB_OUTPUT"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v7
        with:
          name: fuo-evolve-release-multi-abi-signed-${{ github.sha }}.apk
          path: ${{ steps.artifact.outputs.path }}
          archive: false
          if-no-files-found: error

  publish-canary:
    name: Publish master Canary update
    needs:
      - test
      - build-release-apks
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download current master APK artifact
        uses: actions/download-artifact@v8
        with:
          name: fuo-evolve-release-multi-abi-signed-${{ github.sha }}.apk
          path: build/canary

      - name: Prepare Canary distribution
        env:
          CANARY_APK: build/canary/fuo-evolve-release-multi-abi-signed-${{ github.sha }}.apk
          CANARY_URL: https://raw.githubusercontent.com/feeluown/FuoEvolve/canary-dist/fuo-evolve-canary.apk
        run: |
          test -f "$CANARY_APK"
          dist_dir="$RUNNER_TEMP/canary-dist"
          rm -rf "$dist_dir"
          mkdir -p "$dist_dir"
          cp "$CANARY_APK" "$dist_dir/fuo-evolve-canary.apk"
          COMMIT_SHA="$GITHUB_SHA" \
          WORKFLOW_RUN_ID="$GITHUB_RUN_ID" \
          RELEASE_NOTES_URL="https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}" \
            bash scripts/write-update-manifest.sh \
              canary \
              "$dist_dir/fuo-evolve-canary.apk" \
              "$dist_dir/canary.json" \
              "$CANARY_URL"

      - name: Publish Canary distribution branch
        run: |
          dist_dir="$RUNNER_TEMP/canary-dist"
          git checkout --orphan canary-dist
          git rm -rf .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp "$dist_dir/fuo-evolve-canary.apk" ./fuo-evolve-canary.apk
          cp "$dist_dir/canary.json" ./canary.json
          git add fuo-evolve-canary.apk canary.json
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "canary: ${GITHUB_SHA}"
          git push --force origin HEAD:refs/heads/canary-dist
